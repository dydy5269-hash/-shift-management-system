<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shift Schedule</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-main:#0F172A; --bg-card:#1E293B;
  --bg-input:#0F172A; --bg-hover:#334155;
  --text-main:#F1F5F9; --text-muted:#94A3B8; --text-sub:#64748B;
  --border:#334155; --border2:#1E293B;
  --accent:#3B82F6;
}
body.light-mode{
  --bg-main:#F0F4F8; --bg-card:#FFFFFF;
  --bg-input:#FFFFFF; --bg-hover:#E2E8F0;
  --text-main:#0F172A; --text-muted:#475569; --text-sub:#64748B;
  --border:#CBD5E1; --border2:#E2E8F0;
  --accent:#2563EB;
}
html,body{background:var(--bg-main) !important;color:var(--text-main);font-family:Arial,sans-serif;font-size:13px;min-height:100vh;transition:background 0.2s,color 0.2s;}
#app{background:var(--bg-main) !important;min-height:100vh;}
/* Light mode overrides for inline-styled elements */
body.light-mode [style*="background:#0F172A"]{background:var(--bg-main) !important;color:var(--text-main) !important;}
body.light-mode [style*="background:#111827"]{background:#E2E8F0 !important;color:var(--text-main) !important;}
body.light-mode [style*="background:#1E293B"]{background:var(--bg-card) !important;color:var(--text-main) !important;}
body.light-mode [style*="background:#0F172A;color:#E2E8F0"]{background:var(--bg-main) !important;color:var(--text-main) !important;}
body.light-mode [style*="color:#E2E8F0"]{color:var(--text-main) !important;}
body.light-mode [style*="color:#F8FAFC"]{color:var(--text-main) !important;}
body.light-mode [style*="color:#94A3B8"]{color:var(--text-muted) !important;}
body.light-mode [style*="border:1px solid #334155"]{border-color:var(--border) !important;}
body.light-mode [style*="border-bottom:1px solid #334155"]{border-color:var(--border) !important;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;font-size:12px;}
.inp{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text-main);font-size:12px;direction:rtl;box-sizing:border-box;outline:none;}
.inp:focus{border-color:var(--accent);}
.lb-bar{height:6px;border-radius:3px;background:#334155;overflow:hidden;margin-top:2px;}
body.light-mode .lb-bar{background:#CBD5E1;}
.lb-bar-fill{height:100%;border-radius:3px;transition:width 0.3s;}
</style>
</head>
<body>
<div id="app" style="min-height:100vh;"></div>
<script>
// =============================================
// SHIFT SCHEDULE SYSTEM
// Pure ES5 — no arrow functions, no template literals,
// no let/const, no Array.from, no spread
// =============================================

// ── Constants ────────────────────────────────
var MAX_WORK = 19;
var MIN_GRP = 4;
var MAX_GRP = 5;

var SC = {
  morning: {bg:"#FFFFFF",tx:"#000000",lb:"Morning",ic:"☀️",code:"M"},  // White
  evening: {bg:"#FFFFFF",tx:"#000000",lb:"Evening",ic:"🌆",code:"E"},  // White
  night:   {bg:"#FFFFFF",tx:"#000000",lb:"Night",  ic:"🌙",code:"N"},  // White
  off:     {bg:"#F1F5F9",tx:"#475569",lb:"Off",    ic:"🏠",code:"OFF"} // Grey
};
var LC = {
  annual:   {bg:"#DCFCE7",tx:"#14532D",lb:"Annual Leave",    code:"AL",  pbg:"#86EFAC"}, // Green
  sick:     {bg:"#FEE2E2",tx:"#7F1D1D",lb:"Sick Leave",      code:"SL",  pbg:"#FCA5A5"}, // Red
  emergency:{bg:"#FFF7ED",tx:"#7C2D12",lb:"Emergency Leave", code:"EL",  pbg:"#FDBA74"}, // Orange
  paternal: {bg:"#FCE7F3",tx:"#831843",lb:"Paternal Leave",  code:"PL",  pbg:"#F9A8D4"}, // Pink
  coff:     {bg:"#E0F2FE",tx:"#0C4A6E",lb:"C-OFF",           code:"C-OFF",pbg:"#7DD3FC"}, // Sky Blue
  training: {bg:"#ECFDF5",tx:"#065F46",lb:"Training",        code:"TL",  pbg:"#6EE7B7"}, // Teal
  unpaid:   {bg:"#F5F5F4",tx:"#292524",lb:"Unpaid Leave",    code:"UL",  pbg:"#D6D3D1"}, // Stone
  other:    {bg:"#FFF1F2",tx:"#881337",lb:"Other Leave",     code:"OL",  pbg:"#FDA4AF"}  // Rose (distinct from PL pink)
};
var OT = {bg:"#FFD700",tx:"#000000",lb:"Overtime",code:"OT",pbg:"#FFD700"}; // Bright Yellow

var ROLES = {
  SCE: {lb:"Shift Control Engineer",      sh:"SCE", cl:"#DC2626"},
  ASCE:{lb:"Asst. Shift Control Engineer",sh:"ASCE",cl:"#EA580C"},
  CRE: {lb:"Control Room Engineer",       sh:"CRE", cl:"#7C3AED"},
  ACRE:{lb:"Asst. Control Room Engineer", sh:"ACRE",cl:"#0284C7"},
  FE:  {lb:"Field Engineer",              sh:"FE",  cl:"#059669"}
};
var RK = ["SCE","ASCE","CRE","ACRE","FE"];

// Coverage compatibility
function compatRoles(role) {
  if (role === "SCE")  return ["SCE","ASCE"];
  if (role === "CRE")  return ["CRE","ASCE","ACRE"];
  if (role === "FE")   return ["FE","ACRE"];
  return [role];
}

// 4 slots per shift
var SLOTS = [
  {id:"SCE",role:"SCE"},
  {id:"CRE",role:"CRE"},
  {id:"FE1",role:"FE"},
  {id:"FE2",role:"FE"}
];

// Rotation: 5 groups, 10-day cycle, exactly 1 group per shift
var ROT = [
  ["morning","morning","evening","evening","night","night","off","off","off","off"],
  ["off","off","morning","morning","evening","evening","night","night","off","off"],
  ["off","off","off","off","morning","morning","evening","evening","night","night"],
  ["night","night","off","off","off","off","morning","morning","evening","evening"],
  ["evening","evening","night","night","off","off","off","off","morning","morning"]
];

var GR = ["A","B","C","D","E"];
var GR_ALL = ["A","B","C","D","E","G"]; // includes General group
var GRC = {A:"#EF4444",B:"#10B981",C:"#F59E0B",D:"#8B5CF6",E:"#3B82F6",G:"#64748B"};

// General (G) group schedule: Sun-Thu = morning, Fri-Sat = off
function getGeneralShift(ds) {
  var d = parseDs(ds);
  var dow = d.getDay(); // 0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat
  return (dow === 5 || dow === 6) ? "off" : "morning";
}
var GRC = {A:"#60A5FA",B:"#34D399",C:"#F59E0B",D:"#F472B6",E:"#A78BFA",G:"#94A3B8"};
var MAR = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAR = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DSH = ["Su","Mo","Tu","We","Th","Fr","Sa"];

var DEF_ADMINS = [{id:"sa1",username:"admin",password:"-969161597",role:"superadmin",name:"System Admin"}];

// Permission levels:
// superadmin: everything
// admin:      everything EXCEPT managing admin users (Admins tab)
// viewer:     read-only — can see Coverage and Stats only, no edits

// What each role CAN do
var ROLE_PERMS = {
  superadmin: {
    canEdit: true, canApproveLeave: true, canManageStaff: true,
    canManageAdmins: true, canExport: true, canManageRules: true,
    canAssignOT: true, canTransfer: true
  },
  admin: {
    canEdit: true, canApproveLeave: true, canManageStaff: true,
    canManageAdmins: false, canExport: true, canManageRules: true,
    canAssignOT: true, canTransfer: true
  },
  viewer: {
    canEdit: false, canApproveLeave: false, canManageStaff: false,
    canManageAdmins: false, canExport: true, canManageRules: false,
    canAssignOT: false, canTransfer: false
  }
};

function getMyRole() {
  if (!STATE.isAdmin || !STATE.currentUser) return "viewer";
  return STATE.currentUser.role || "viewer";
}

function can(perm) {
  var role = getMyRole();
  var perms = ROLE_PERMS[role] || ROLE_PERMS.viewer;
  return perms[perm] === true;
}

function requirePerm(perm, cb) {
  if (!STATE.isAdmin) { requireAdmin(function(){ if(can(perm)) cb(); else showNotif("⛔ No permission for this action",true); }); return; }
  if (can(perm)) { cb(); return; }
  showNotif("⛔ Your role ("+getMyRole()+") cannot perform this action",true);
}
var DEF_RULES = {SCE:1,CRE:1,FE:1,ASCE:1,ACRE:1};

// Leave types that trigger an email notification on approval
var EMAIL_TRIGGER_TYPES = ["sick","emergency","other"];

// Show a modal with the pre-written email text — admin copies and sends manually
function openOutlookEmail(req) {
  var emp = STATE.emps[req.empId] || {name:"Unknown", role:""};
  var ltLabel = (LC[req.lt]||{}).lb || req.lt;
  var ltCode  = (LC[req.lt]||{}).code || req.lt.toUpperCase();
  var managerName = (STATE.rules && STATE.rules.notifyManagerName) || "Sir";
  var empRc = getR(emp.role);
  var empRoleTitle = getRTitle(empRc.sh);

  // Build email lines per affected day
  var coverLines = [];
  if (STATE.covData && STATE.covData.cov) {
    rangeD(req.from, req.to).forEach(function(ds) {
      var dayData = STATE.covData.cov[ds];
      if (!dayData) return;
      dayData.issues.forEach(function(iss) {
        if (iss.leaveEmp && iss.leaveEmp.id === req.empId && iss.emp) {
          coverLines.push({
            date: ds,
            shift: (SC[iss.shift]||{}).lb || iss.shift,
            coverName: iss.emp.name
          });
        }
      });
    });
  }

  var bodyText = "Dear Mr. " + managerName + ",\n\n";
  if (coverLines.length > 0) {
    coverLines.forEach(function(cl) {
      bodyText += "On " + cl.date + " " + cl.shift + " Shift Shortage due to "
        + empRoleTitle + " Mr. " + emp.name
        + " taking " + ltLabel + " (" + ltCode + ")"
        + " and arrange Mr. " + cl.coverName + " for OT.\n\n";
    });
  } else {
    rangeD(req.from, req.to).forEach(function(ds) {
      bodyText += "On " + ds + " Shift Shortage due to "
        + empRoleTitle + " Mr. " + emp.name
        + " taking " + ltLabel + " (" + ltCode + ").\n\n";
    });
  }
  bodyText += "Best Regards,\nShift Schedule System";

  // Show modal with copyable textarea
  var old2 = document.getElementById("email-modal"); if(old2&&old2.parentNode) old2.parentNode.removeChild(old2);
  var overlay = document.createElement("div");
  overlay.id = "email-modal";
  overlay.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:99999;display:flex;align-items:center;justify-content:center;";

  var box2 = document.createElement("div");
  box2.style.cssText = "background:#1E293B;border-radius:14px;padding:20px;width:90%;max-width:500px;border:1px solid #334155;";

  var ttl = mkEl("div","font-size:14px;font-weight:700;color:#F8FAFC;margin-bottom:4px;","📧 Email Notification");
  var sub2 = mkEl("div","font-size:11px;color:#64748B;margin-bottom:12px;",
    "Subject: Shift Shortage — "+ltLabel+" — "+emp.name);

  var ta = document.createElement("textarea");
  ta.value = bodyText;
  ta.readOnly = false;
  ta.style.cssText = "width:100%;height:180px;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px;color:#E2E8F0;font-size:12px;font-family:Arial,sans-serif;resize:vertical;box-sizing:border-box;line-height:1.6;";

  var btnRow7 = mkRow("gap:8px;margin-top:12px;");
  var copyBtn3 = mkBtn("📋 Copy Text","#3B82F6",function(){
    ta.select();
    try{document.execCommand("copy");copyBtn3.textContent="✅ Copied!";}catch(e){}
    setTimeout(function(){copyBtn3.textContent="📋 Copy Text";},2000);
  },"border-radius:8px;padding:8px 16px;font-size:12px;flex:1;");
  var closeBtn2 = mkBtn("✕ Close","#374151",function(){
    if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
  },"border-radius:8px;padding:8px 14px;font-size:12px;color:#94A3B8;");

  ap(btnRow7, copyBtn3, closeBtn2);
  ap(box2, ttl, sub2, ta, btnRow7);
  overlay.appendChild(box2);
  overlay.onclick = function(e){if(e.target===overlay&&overlay.parentNode)overlay.parentNode.removeChild(overlay);};
  (document.body||document.documentElement).appendChild(overlay);
}

// No default employee-to-role linkages — the admin explicitly picks named
// individuals to "borrow" into a role's leave-limit pool (see
// STATE.linkedEmployees below). Nothing is linked out of the box.
var DEF_LINKED_ROLES = {};

var INIT_EMPS = {
  A:[{name:"Said Alshahri",role:"SCE"},{name:"Khalid AlRawas",role:"CRE"},{name:"Bakhit Al-Mashani",role:"FE"},{name:"Nasser Almamari",role:"FE"}],
  B:[{name:"Mundhar",role:"SCE"},{name:"Alawi Al Ibrahim",role:"CRE"},{name:"Abdul Rahim",role:"FE"},{name:"Salim Al Amri",role:"FE"},{name:"Suhail Zaabnut",role:"FE"}],
  C:[{name:"Harry",role:"SCE"},{name:"Subramanian",role:"CRE"},{name:"Ali Al-Mashani",role:"FE"},{name:"Hassan Tabook",role:"FE"},{name:"Ghali Baitsaid",role:"FE"}],
  D:[{name:"Ahmed Al-shahri",role:"SCE"},{name:"Madhu",role:"CRE"},{name:"Mohammed",role:"FE"},{name:"Khalid Al Hadhri",role:"FE"}],
  E:[{name:"Aiman ALYafai",role:"SCE"},{name:"Mulham Al amri",role:"CRE"},{name:"Omran BaOmar",role:"FE"},{name:"Nasser Al Jafary",role:"FE"},{name:"Abdullah Al Ibrahim",role:"FE"}]
};

// ── Helpers ────────────────────────────────────
function hpw(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h = h | 0;
  }
  return String(h);
}
function sLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function lLS(k, fb) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function doy(date) { return Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000) - 1; }
function shiftFor(gi, d) {
  if (gi < 0) return "morning"; // General group (G) — always morning when working
  return ROT[gi % 5][((d % 10) + 10) % 10];
}
function mkDs(y, m, d) {
  var mm = m + 1 < 10 ? "0" + (m + 1) : "" + (m + 1);
  var dd = d < 10 ? "0" + d : "" + d;
  return y + "-" + mm + "-" + dd;
}
function fmtD(s) {
  if (!s) return "";
  var p = s.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}
function rangeD(from, to) {
  var a = [], c = new Date(from), e = new Date(to);
  while (c <= e) {
    a.push(dsFromDate(c));
    c.setDate(c.getDate() + 1);
  }
  return a;
}
function dowN(y, m, d) { return new Date(y, m, d).getDay(); }
function daysInM(y, m) { return new Date(y, m + 1, 0).getDate(); }
// iOS Safari rejects "YYYY-MM-DD" string in new Date() — always parse
// date strings by splitting into parts and using the numeric constructor.
function parseDs(ds) {
  var p = ds.split("-");
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}
// Safe ISO date string from a Date object (avoids toISOString UTC issues)
function dsFromDate(d) {
  var y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  return y+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function genId() { return "e" + Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }
function lmapGet(lm, id, ds) { return lm[id] ? lm[id][ds] : null; }
// Only Annual leave and C-OFF are subject to the "max N same-role on leave" conflict rule.
// Sick, Emergency, Paternal, Training, Unpaid are always allowed — system finds OT cover instead.
function isRestrictedLeaveType(lt) { return lt === "annual" || lt === "coff"; }
function getR(role) { return ROLES[role] || ROLES.FE; }
function getRTitle(role) { return (STATE.roleTitles && STATE.roleTitles[role]) || role; }
function grpCount(emps, g) { var c = 0; for (var k in emps) if (emps[k].group === g) c++; return c; }

function buildEmps() {
  var e = {};
  for (var gi = 0; gi < GR.length; gi++) {
    var g = GR[gi], ns = INIT_EMPS[g] || [];
    for (var ni = 0; ni < ns.length; ni++) {
      var id = g + "-" + ni;
      e[id] = {id:id, group:g, role:ns[ni].role, name:ns[ni].name, gi:gi, order:ni};
    }
  }
  return e;
}

// True if `emp` is marked "Extra" for their group on date `ds` — they still
// work their group's normal rotation, but should be excluded FIRST from the
// 4 fixed slots (SCE/CRE/FE1/FE2) whenever the group has a surplus member
// that day, showing up in the "Extra Team" section instead.
function isMarkedExtra(emp, ds) {
  var ranges = STATE.extraRanges && STATE.extraRanges[emp.id];
  if (!ranges || !ranges.length) return false;
  for (var ri2 = 0; ri2 < ranges.length; ri2++) {
    if (ds >= ranges[ri2].from && ds <= ranges[ri2].to) return true;
  }
  return false;
}

// Permanent auto-linkage for LEAVE PURPOSES ONLY: every ACRE automatically
// counts toward CRE's leave pool, and every ASCE automatically counts
// toward SCE's leave pool — no manual linking required. This is completely
// separate from the coverage/OT engine (compatRoles), which is untouched
// and keeps working exactly as before (ACRE can still cover CRE/FE shifts,
// ASCE can still step up to cover SCE, etc.) regardless of this setting.
// AUTO_LEAVE_POOL is intentionally empty — all role-to-pool linkages are
// configured manually by the admin from Rules → Linked Employees.
// This means ASCE and ACRE employees are NOT automatically counted toward
// any pool unless the admin explicitly adds them by name with an optional
// date range. This gives full control over who counts where.
var AUTO_LEAVE_POOL = {};

// Returns true if `emp` counts toward `role`'s simultaneous-leave pool on
// date `ds` — true because:
//   (a) their own role IS `role`, OR
//   (b) their role auto-links to `role` via AUTO_LEAVE_POOL (every
//       ACRE→CRE, every ASCE→SCE, always, for leave purposes only), OR
//   (c) the admin explicitly linked this specific named employee into
//       `role`'s pool, optionally only within a configured date range
//       (so the admin can later swap which person is linked over time).
// Returns the employee's role as it was on a specific date
function empRoleOnDate(emp, ds) {
  if (!ds) return emp.role;
  var parts = ds.split("-");
  var y = parseInt(parts[0]), m = parseInt(parts[1]) - 1; // 0-indexed
  return getEmpRoleAtMonth(emp, y, m);
}

function countsTowardRolePool(emp, role, ds) {
  var roleAtDate = ds ? empRoleOnDate(emp, ds) : emp.role;
  if (roleAtDate === role) return true;
  if (AUTO_LEAVE_POOL[roleAtDate] === role) return true;
  var linked = STATE.linkedEmployees && STATE.linkedEmployees[role];
  if (!linked) return false;
  for (var li = 0; li < linked.length; li++) {
    var entry = linked[li];
    var entryId = (typeof entry === "string") ? entry : entry.empId;
    if (entryId !== emp.id) continue;
    if (typeof entry === "string") return true;
    if (!ds) return true;
    if (entry.from && ds < entry.from) continue;
    if (entry.to && ds > entry.to) continue;
    return true;
  }
  return false;
}

function getRolesEmpCountsToward(emp, ds) {
  var set = {};
  var roleAtDate = ds ? empRoleOnDate(emp, ds) : emp.role;
  var isAssistantRole = (roleAtDate === "ASCE" || roleAtDate === "ACRE");
  if (!isAssistantRole) set[roleAtDate] = true;
  if (AUTO_LEAVE_POOL[roleAtDate]) set[AUTO_LEAVE_POOL[roleAtDate]] = true;
  var le = STATE.linkedEmployees || {};
  for (var rk in le) {
    var arr = le[rk] || [];
    for (var ai5 = 0; ai5 < arr.length; ai5++) {
      var entry = arr[ai5];
      var entryId = (typeof entry === "string") ? entry : entry.empId;
      if (entryId !== emp.id) continue;
      if (typeof entry === "string") { set[rk] = true; continue; }
      if (!ds) { set[rk] = true; continue; }
      if (entry.from && ds < entry.from) continue;
      if (entry.to && ds > entry.to) continue;
      set[rk] = true;
    }
  }
  return Object.keys(set);
}

function getEmpEffectiveShift(emp, ds, dv) {
  var ovr = STATE.shiftOverride && STATE.shiftOverride[emp.id] && STATE.shiftOverride[emp.id][ds];
  if (ovr) return ovr;
  // General group (G) or gi=-1: use weekday-based schedule
  if (emp.group === "G" || emp.gi < 0) return getGeneralShift(ds);
  var tr = STATE.transferLog && STATE.transferLog[emp.id];
  if (tr && tr.startDate) {
    if (ds < tr.startDate) {
      return shiftFor(tr.oldGi, dv);
    } else if (tr.endDate && ds > tr.endDate) {
      return shiftFor(tr.oldGi, dv);
    } else {
      // In transfer window — use new group (handle General gi=-1)
      return (tr.newGi < 0) ? getGeneralShift(ds) : shiftFor(tr.newGi, dv);
    }
  }
  return shiftFor(emp.gi, dv);
}

function countWorkDays(emp, lmap, y, m) {
  var dim = daysInM(y, m), cnt = 0;
  for (var d = 1; d <= dim; d++) {
    var ds = mkDs(y, m, d), dv = doy(new Date(y, m, d));
    if (getEmpEffectiveShift(emp, ds, dv) === "off") continue;
    if (lmapGet(lmap, emp.id, ds)) continue;
    cnt++;
  }
  return cnt;
}

function buildLmap(lreqs) {
  var lmap = {};
  for (var i = 0; i < lreqs.length; i++) {
    var r = lreqs[i];
    if (r.status !== "approved" || r.lt === "overtime") continue;
    if (!lmap[r.empId]) lmap[r.empId] = {};
    var dates = rangeD(r.from, r.to);
    for (var j = 0; j < dates.length; j++) lmap[r.empId][dates[j]] = r.lt || "annual";
  }
  return lmap;
}

// ── STATE ─────────────────────────────────────
var STATE = {
  isAdmin: false, currentUser: null, tab: "cov",
  annualPlan: null,  // {year: {empId: [{month,from,to,days,note,status}]}}
  year: new Date().getFullYear(), month: new Date().getMonth(),
  selDay: null,
  admins: null, emps: null, lreqs: null, rules: null, roleTitles: null,
  notifTimer: null, addGrp: null, editEmpId: null,
  leaveForm: {empId:"",from:"",to:"",lt:"annual",reason:""},
  filterEmp: "", filterSt: "all", showLeaveForm: false,
  staffGroupMonth: null,
  staffViewYear: null, staffViewMonth: null,
  theme: "dark",
  compareMonth: null,
  leaveBalance: {},
  compareMonth: null,
  // holidays: [{id, name, from, to}] — public holidays defined by admin

            ? compat.concat(["FE"]) : compat;

          // Build full candidate list (anyone off, compatible role, not on leave)
          // ── No-Rest Rule ─────────────────────────────────────────────────
          // Build exclusion BEFORE allCands so night→morning/evening is blocked
          // Also block employees on their last rest day (next day they work)
          var noRestExclusion = {};
          if (sk === "morning" || sk === "evening") {
            for (var nrI = 0; nrI < all.length; nrI++) {
              if (cameFromNightYesterday(all[nrI], ds)) {
                noRestExclusion[all[nrI].id] = true;
              }
            }
          }
          // Block last-rest-day for Evening and Night only
          // (Morning OT on last rest day is allowed — employee has recovery time after)
          if (sk === "evening" || sk === "night") {
            for (var lrdI = 0; lrdI < all.length; lrdI++) {
              if (isLastRestDay(all[lrdI], ds)) {
                noRestExclusion[all[lrdI].id] = true;
              }
            }
          }

          var allCands = [];
          var overCapCands = [];
          for (var ci2 = 0; ci2 < all.length; ci2++) {
            var ec = all[ci2];
            if (usedCover[ec.id]) continue;
            if (ec.group === "G") continue; // General staff not eligible for OT cover
            if (compatForSearch.indexOf(getEmpRoleAtMonth(ec, y, m)) < 0) continue;
            if (getEmpEffectiveShift(ec, ds, dv) !== "off") continue;
            if (lmapGet(lmap, ec.id, ds)) continue;
            var manuallyOff = STATE.shiftOverride && STATE.shiftOverride[ec.id] && STATE.shiftOverride[ec.id][ds] === "off";
            if (manuallyOff) continue;
            // Hard block: came from night yesterday → cannot work morning/evening
            if (noRestExclusion && noRestExclusion[ec.id]) continue;
            var noRest = (sk === "morning" || sk === "evening") && cameFromNightYesterday(ec, ds);
            var lastRestDay = isLastRestDay(ec, ds); // tomorrow they work — no recovery
            var otSoFar = (otHistory[ec.id] || []).length;
            var otInCycle = otInRestCycle(ec.id, ds);
            var restExhausted = isRestCycleFullyConsumed(ec, ds);
            var fromBigGroup = (groupSizes[ec.group]||0) >= 5;
            // Store the employee's role AS OF this month in the candidate object
            // so priority blocks below don't need to re-call getEmpRoleAtMonth
            var empHistRole = getEmpRoleAtMonth(ec, y, m);
            var candObj = {emp:ec, wd:wdMap[ec.id]||0,
              crossRole: empHistRole !== role,
              histRole: empHistRole,
              noRest:noRest, lastRestDay:lastRestDay, otSoFar:otSoFar, otInCycle:otInCycle,
              restExhausted:restExhausted, fromBigGroup:fromBigGroup};
            if (otSoFar >= OT_MONTHLY_CAP) {
              // Over the hard cap — keep for manual override but not auto-select
              overCapCands.push(candObj);
            } else {
              allCands.push(candObj);
            }
          }

          // Build a SEPARATE manual-selector list that includes ALL employees
          // with the EXACT SAME role (e.g. every SCE, not just those on a rest
          // day) so the admin can manually pick anyone — even someone currently
          // on a working shift. This list is shown in the UI picker only and
          // never used for auto-selection. Cross-role (ASCE for SCE slot etc.)
          // candidates are excluded here since the admin asked to see only the
          // exact same title.
          var manualCands = [];
          var manualCompatRoles = compatRoles(role); // e.g. CRE → ["CRE","ASCE","ACRE"]
          for (var mci = 0; mci < all.length; mci++) {
            var me2 = all[mci];
            // Include anyone with a compatible role (CRE or ACRE for CRE slot,
            // SCE or ASCE for SCE slot, FE or ACRE for FE slot)
            if (manualCompatRoles.indexOf(getEmpRoleAtMonth(me2, y, m)) < 0) continue;
            if (lmapGet(lmap, me2.id, ds)) continue; // skip if on approved leave
            var mcEff = getEmpEffectiveShift(me2, ds, dv);
            var mcOtSoFar = (otHistory[me2.id] || []).length;
            var mcOnShift = (mcEff !== "off");
            if (me2.group === "G") continue; // General staff not eligible for OT
            var me2HistRole = getEmpRoleAtMonth(me2, y, m);
            manualCands.push({
              emp: me2,
              wd: wdMap[me2.id]||0,
              crossRole: me2HistRole !== role,
              histRole: me2HistRole, // true for ACRE in CRE slot etc.
              noRest: (sk==="morning"||sk==="evening") && cameFromNightYesterday(me2, ds),
              otSoFar: mcOtSoFar,
              otInCycle: otInRestCycle(me2.id, ds),
              restExhausted: isRestCycleFullyConsumed(me2, ds),
              fromBigGroup: (groupSizes[me2.group]||0) >= 5,
              onShift: mcOnShift,
              effShift: mcEff
            });
          }
          // Sort: exact role first, off-duty before on-shift, then fewest OT
          manualCands.sort(function(a,b){
            var exactA = a.histRole===role?0:1, exactB = b.histRole===role?0:1;
            if (exactA !== exactB) return exactA - exactB;
            if (a.onShift !== b.onShift) return a.onShift ? 1 : -1;
            return a.otSoFar - b.otSoFar;
          });
          // Sort: exact role first, then NOT rest-exhausted, then prefer
          // 5-member-group backups when needed, then fewest OT-cover days
          // so far (fairness), then fewest total work days, then those WITH
          // adequate rest first.
          allCands.sort(function(a,b) {
            var ae=a.histRole===role?0:1, be=b.histRole===role?0:1;
            if (ae !== be) return ae-be;
            if (a.restExhausted !== b.restExhausted) return a.restExhausted ? 1 : -1; // never-rested-this-cycle last
            if (a.noRest !== b.noRest) return a.noRest ? 1 : -1; // rested first
            if (a.otSoFar !== b.otSoFar) return a.otSoFar - b.otSoFar; // least-used first
            return a.wd - b.wd;
          });

          // AUTO-eligible candidates must satisfy ALL of:
          //   - adequate rest (not straight off a night shift)
          //   - rest cycle NOT fully consumed (every day off this stretch
          //     already used as OT) — if their entire rest period would be
          //     wiped out, auto-selection skips them; a 5-member-group
          //     backup or manual pick is needed instead
          //   - MONTHLY HARD CAP: under 6 total OT days this month (never
          //     auto-exceeded, regardless of admin preference)
          //   - REST-CYCLE COMFORT PREFERENCE: under 2 OT days within their
          //     current 4-day rest stretch (a softer preference — if every
          //     candidate fails only this check, the gap is surfaced as
          //     "needsManual" rather than auto-picking someone overworked
          //     within one rest cycle).
          var autoCands = [];
          for (var aci = 0; aci < allCands.length; aci++) {
            if (noRestExclusion[allCands[aci].emp.id]) continue;
            if (allCands[aci].noRest) continue;
            if ((sk==="evening"||sk==="night") && allCands[aci].lastRestDay) continue;
            if (allCands[aci].restExhausted) continue;
            if (allCands[aci].otSoFar >= OT_MONTHLY_CAP) continue;
            if (allCands[aci].otInCycle >= OT_REST_CYCLE_PREF) continue;
            autoCands.push(allCands[aci]);
          }
          if (autoCands.length === 0) {
            for (var aci2 = 0; aci2 < allCands.length; aci2++) {
              var c2 = allCands[aci2];
              if (noRestExclusion[c2.emp.id]) continue;
              if (c2.noRest || c2.restExhausted) continue;
              if ((sk==="evening"||sk==="night") && c2.lastRestDay) continue;
              if (c2.otSoFar >= OT_MONTHLY_CAP) continue;
              if (c2.fromBigGroup) { autoCands.push(c2); break; }
            }
          }
          // Last resort: all available candidates are excluded by noRest rule
          // → surface them as needsManual so admin can decide
          var noRestCands = [];
          if (autoCands.length === 0 && overCapCands.length === 0) {
            for (var nrc = 0; nrc < allCands.length; nrc++) {
              if (noRestExclusion[allCands[nrc].emp.id]) noRestCands.push(allCands[nrc]);
            }
          }

          var found = null, foundManual = false, foundInternal = false, vacatedRole = null;

          // Admin explicitly chose "None — Leave Uncovered" for this slot:
          // skip the entire auto-search and record it as intentionally
          // uncovered so it can be flagged in print.
          if (isNoneCover) {
            issues.push({type:"noCover", shift:sk, slotId:slotId, role:role,
              leaveEmp:leaveEmp||null, emp:null, internal:false, cands:[]});
            continue;
          }

          // When the month is LOCKED:
          // - Days with NEW leaves (added after lock) → run auto-search normally
          //   for that day so the gap gets a fresh cover assignment.
          // - All other days with no new leaves → skip auto-search and use
          //   only the snapshot (or stay critical if no snapshot exists).
          // We still compute allCands so the UI can show a manual selector.
          if (isLocked && !manualId && !newLeaveDates[ds]) {
            issues.push({type:"critical", shift:sk, slotId:slotId, role:role,
              leaveEmp:leaveEmp||null, emp:null, internal:false,
              cands:allCands, manualCands:manualCands, locked:true});
            continue;
          }

          // Manual selection is always allowed to override the fairness cap
          // (OT day-count) or reduced-rest restriction — the admin takes
          // responsibility for that override. BUT it must still be a
          // role-COMPATIBLE person (e.g. a CRE can never be manually
          // assigned to an SCE slot) — otherwise the schedule would show
          // someone "covering" a role they are not qualified for.
          // For locked months with frozen employee data, skip the compat
          // check entirely — the assignment was valid at lock time and must
          // be honoured regardless of any role changes since then.
          var manualIsCompat;
          if (frozenEmpData && isLocked) {
            manualIsCompat = true; // always trust the frozen snapshot
          } else {
            manualIsCompat = manualEmp && compatForSearch.indexOf(manualEmp.role) >= 0;
          }
          if (manualEmp && !manualIsCompat) {
            // Stale/invalid manual pick (role changed since it was set,
            // or picked for a slot it never qualifies for) — ignore it and
            // fall through to normal auto/internal logic below.
            manualEmp = null;
          }

          if (manualEmp && !usedCover[manualEmp.id]) {
            // For locked months: validate that the snapshot-assigned person
            // is actually AVAILABLE (not on leave themselves). If they're now
            // on leave too, the slot needs manual reassignment.
            var manualOnLeave = manualEmp && lmapGet(lmap, manualEmp.id, ds);
            if (isLocked && manualOnLeave) {
              // Snapshot person is now also on leave — escalate to manual
              issues.push({type:"critical", shift:sk, slotId:slotId, role:role,
                leaveEmp:leaveEmp||null, emp:null, internal:false, cands:[], locked:true,
                note:"Assigned cover ("+manualEmp.name+") is now also on leave — manual reassignment needed"});
              continue;
            }
            // Manual selection always allowed, even beyond the fairness cap or
            // with reduced rest — admin takes responsibility for the override.
            found = manualEmp; foundManual = true;
          } else if (role === "SCE") {
            // ── SCE PRIORITY ─────────────────────────────────────────────
            // 1. Real SCE from a different group via OT
            // 2. Internal ASCE on same shift (free, no OT cost)
            // 3. External ASCE from a different group via OT (last resort)
            var sceAutoCands = autoCands.filter(function(c){ return c.histRole === "SCE"; });
            if (sceAutoCands.length > 0) {
              found = sceAutoCands[0].emp;
            } else {
              var asceOnShift = (inShift[sk]["ASCE"] || [])[0];
              if (asceOnShift && !promotedAway[asceOnShift.id]) {
                found = asceOnShift; foundInternal = true;
                promotedAway[asceOnShift.id] = true;
                // Record that this ASCE vacated CRE slot → triggers OT search for CRE
                promotedAwayFrom[asceOnShift.id] = sk; // shift key for this promotion
              } else {
                var asceAutoCands = autoCands.filter(function(c){ return c.histRole === "ASCE"; });
                if (asceAutoCands.length > 0) found = asceAutoCands[0].emp;
              }
            }
          } else if (role === "CRE") {
            // ── CRE PRIORITY ─────────────────────────────────────────────
            // 1. Real CRE from a different group via OT
            // 2. Internal ACRE on same shift (free, no OT cost)
            // 3. External ACRE from a different group via OT (last resort)
            var creAutoCands = autoCands.filter(function(c){ return c.histRole === "CRE"; });
            if (creAutoCands.length > 0) {
              found = creAutoCands[0].emp;
            } else {
              var acreOnShift = (inShift[sk]["ACRE"] || [])[0];
              if (acreOnShift && !promotedAway[acreOnShift.id]) {
                found = acreOnShift; foundInternal = true;
                promotedAway[acreOnShift.id] = true;
              } else {
                var acreAutoCands = autoCands.filter(function(c){ return c.histRole === "ACRE"; });
                if (acreAutoCands.length > 0) found = acreAutoCands[0].emp;
              }
            }
          } else if (role === "FE") {
            // ── FE PRIORITY ──────────────────────────────────────────────
            // 1. Real FE external (off day, OT) — exact role first
            // 2. Real ACRE external (off day, OT) — compatible role second
            // Internal ACRE promotion is handled separately by CRE slot logic.
            var feAutoCands = autoCands.filter(function(c){ return c.histRole === "FE"; });
            var acreForFe   = autoCands.filter(function(c){ return c.histRole === "ACRE"; });
            if (feAutoCands.length > 0) {
              found = feAutoCands[0].emp;
            } else if (acreForFe.length > 0) {
              found = acreForFe[0].emp;
            }
          } else if (role === "ASCE") {
            // ── ASCE PRIORITY ────────────────────────────────────────────
            // When an ASCE slot itself is vacant (rare — usually ASCE is
            // used to cover SCE rather than having its own dedicated slot):
            // 1. Real CRE from a different group via OT
            // 2. External ACRE from a different group via OT
            // 3. Internal ACRE already on same shift (free, no OT cost)
            var creForAsce = autoCands.filter(function(c){ return c.histRole === "CRE"; });
            if (creForAsce.length > 0) {
              found = creForAsce[0].emp;
            } else {
              var acreForAsceExt = autoCands.filter(function(c){ return c.histRole === "ACRE"; });
              if (acreForAsceExt.length > 0) {
                found = acreForAsceExt[0].emp;
              } else {
                var acreForAsceInt = (inShift[sk]["ACRE"] || [])[0];
                if (acreForAsceInt && !promotedAway[acreForAsceInt.id]) {
                  found = acreForAsceInt; foundInternal = true;
                  promotedAway[acreForAsceInt.id] = true;
                }
              }
            }
          } else if (autoCands.length > 0) {
            // Fallback for any other role not explicitly handled above
            found = autoCands[0].emp;
          }

          if (found) {
            usedCover[found.id] = true;
            if (!foundInternal) {
              if (!otHistory[found.id]) otHistory[found.id] = [];
              otHistory[found.id].push(ds);
            }
            covers.push({emp:found, manual:foundManual, crossRole:found.role!==role, coverRole:found.role,
              internal:foundInternal, vacatedRole:vacatedRole});
            issues.push({type:"cover",shift:sk,slotId:slotId,role:role,emp:found,leaveEmp:leaveEmp,
              manual:foundManual,internal:foundInternal,vacatedRole:vacatedRole,cands:allCands,manualCands:manualCands});
          } else if (allCands.length > 0) {
            covers.push({emp:null, type:"needsManual", cands:allCands, manualCands:manualCands});
            issues.push({type:"needsManual",shift:sk,slotId:slotId,role:role,leaveEmp:leaveEmp,cands:allCands,manualCands:manualCands});
          } else if (overCapCands.length > 0) {
            // All available candidates exceeded the monthly OT cap (6 days).
            // Surface as needsManual so admin can override the cap and assign
            // one of them — better than showing an unsolvable "critical" gap.
            var allCandsForManual = overCapCands.concat(manualCands.filter(function(mc){
              return !overCapCands.some(function(oc){return oc.emp.id===mc.emp.id;});
            }));
            covers.push({emp:null, type:"needsManual", cands:overCapCands, manualCands:allCandsForManual});
            issues.push({type:"needsManual",shift:sk,slotId:slotId,role:role,leaveEmp:leaveEmp,
              cands:overCapCands, manualCands:allCandsForManual,
              note:"All candidates hit the 6-day monthly OT cap — admin override required"});
          } else if (noRestCands.length > 0) {
            // Only night-rest-excluded candidates — surface for manual pick with warning
            covers.push({emp:null, type:"needsManual", cands:noRestCands, manualCands:noRestCands});
            issues.push({type:"needsManual",shift:sk,slotId:slotId,role:role,leaveEmp:leaveEmp,
              cands:noRestCands, manualCands:noRestCands,
              note:"Available candidates just worked night — rest rule applies, admin override required"});
          } else {
            covers.push({emp:null, type:"critical", cands:allCands, manualCands:manualCands});
            issues.push({type:"critical",shift:sk,slotId:slotId,role:role,leaveEmp:leaveEmp,cands:allCands,manualCands:manualCands});
          }
        }
        var slotTag = "ok";
        if (covers.some(function(c){return !c.emp && c.type==="critical";})) slotTag = "critical";
        else if (covers.some(function(c){return !c.emp && c.type==="needsManual";})) slotTag = "needsManual";
        else if (covers.length > 0) slotTag = "covered";
        slots[sk][slotId] = {present:present, onLeave:onLeave, covers:covers, tag:slotTag, role:role,
          cands: hasGap&&covers.length ? (covers[0].cands||[]) : []};

        // Track OT for off-duty employees assigned via slotAssign:
        // if the employee in `present` is naturally OFF today (their
        // effective shift before the override is "off"), this counts as OT
        // and must be recorded in otHistory for fairness tracking and stats.
        if (preOverriddenEmps[slotId]) {
          var poEmp = preOverriddenEmps[slotId];
          var poNatural = crossShiftExcluded[poEmp.id]
            ? getEmpEffectiveShift(poEmp, ds, dv) // was cross-shift
            : getEmpEffectiveShift(poEmp, ds, dv);
          // If they are naturally OFF (not just reassigned from another shift)
          var poIsOff = (poNatural === "off");
          if (poIsOff) {
            if (!otHistory[poEmp.id]) otHistory[poEmp.id] = [];
            if (otHistory[poEmp.id].indexOf(ds) < 0) otHistory[poEmp.id].push(ds);
          }
        }
        // Also check slotAssign for off-day assignments in this slot
        var saEmpId2 = STATE.slotAssign && STATE.slotAssign[ds+":"+sk+":"+slotId];
        if (saEmpId2 && emps[saEmpId2]) {
          var saE2 = emps[saEmpId2];
          var saEff2 = getEmpEffectiveShift(saE2, ds, dv);
          if (saEff2 === "off") {
            // Off-day assignment via slotAssign = OT
            if (!otHistory[saE2.id]) otHistory[saE2.id] = [];
            if (otHistory[saE2.id].indexOf(ds) < 0) otHistory[saE2.id].push(ds);
          }
        }
        // Record everyone who actually worked NIGHT today — both normally
        // present and anyone who covered it — so TOMORROW's rest-check
        // (cameFromNightYesterday) can correctly see that they worked
        // last night even though their base schedule said "off".
        if (sk === "night") {
          if (!nightWorkersByDate[ds]) nightWorkersByDate[ds] = {};
          for (var npi = 0; npi < present.length; npi++) nightWorkersByDate[ds][present[npi].id] = true;
          for (var nci = 0; nci < covers.length; nci++) if (covers[nci].emp) nightWorkersByDate[ds][covers[nci].emp.id] = true;
        }
      }
    }
    cov[ds] = {slots:slots, issues:issues, manualOff:manualOffByShift};
  }
  return {cov:cov, lmap:lmap, wdMap:wdMap, gSz:gSz};
}

// ── PIN Auth ──────────────────────────────────
function requireAdmin(cb) {
  if (STATE.isAdmin) { cb(); return; }
  STATE.pinCb = cb;
  showPinModal();
}

function showPinModal() {
  var old = document.getElementById("pin-ov"); if (old) old.remove();
  var o = document.createElement("div"); o.id = "pin-ov";
  o.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;direction:rtl;";
  var box = document.createElement("div");
  box.style.cssText = "background:#1E293B;border-radius:14px;padding:22px;width:90%;max-width:320px;border:1px solid #334155;";
  box.innerHTML = '<div style="text-align:center;margin-bottom:14px"><div style="font-size:32px">🔐</div><div style="color:#F8FAFC;font-size:14px;font-weight:700;margin-top:6px">Admin Login</div><div style="color:#64748B;font-size:11px;margin-top:2px">admin / admin123</div></div>';
  var errDiv = document.createElement("div");
  errDiv.style.cssText = "background:#7F1D1D;border:1px solid #EF4444;border-radius:7px;padding:7px;margin-bottom:10px;font-size:11px;color:#FCA5A5;text-align:center;display:none";
  box.appendChild(errDiv);
  function makeInput(lbTxt, type) {
    var w = document.createElement("div"); w.style.marginBottom = "10px";
    var lb = document.createElement("label"); lb.style.cssText = "font-size:11px;color:#64748B;display:block;margin-bottom:3px"; lb.textContent = lbTxt;
    var inp = document.createElement("input"); inp.className = "inp"; inp.type = type; inp.placeholder = lbTxt;
    w.appendChild(lb); w.appendChild(inp); box.appendChild(w); return inp;
  }
  var uI = makeInput("Username","text"), pI = makeInput("Password","password");
  pI.style.marginBottom = "14px";
  function doLogin() {
    var found = null;
    for (var i = 0; i < STATE.admins.length; i++) {
      if (STATE.admins[i].username === uI.value.trim() && STATE.admins[i].password === hpw(pI.value)) { found = STATE.admins[i]; break; }
    }
    if (found) {
      STATE.isAdmin = true; STATE.currentUser = found; o.remove(); showNotif("✅ Welcome " + found.name + " · " + found.role);
      if (STATE.pinCb) { var cb = STATE.pinCb; STATE.pinCb = null; cb(); }
    } else {
      errDiv.textContent = "❌ Wrong credentials"; errDiv.style.display = "block"; pI.value = ""; pI.focus();
    }
  }
  pI.addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
  uI.addEventListener("keydown", function(e) { if (e.key === "Enter") pI.focus(); });
  var btnRow = document.createElement("div"); btnRow.style.cssText = "display:flex;gap:8px;";
  var loginBtn = mkBtn("Login","#3B82F6",doLogin,"flex:1;border-radius:8px;padding:11px;font-size:13px;font-weight:700;");
  var cancelBtn = mkBtn("Cancel","#374151",function(){STATE.pinCb=null;o.remove();},"border-radius:8px;padding:11px 12px;font-size:12px;");
  cancelBtn.style.color = "#94A3B8";
  btnRow.appendChild(loginBtn); btnRow.appendChild(cancelBtn); box.appendChild(btnRow);
  var rlBtn = document.createElement("button");
  rlBtn.style.cssText = "display:block;margin:10px auto 0;background:none;border:none;color:#475569;font-size:10px;cursor:pointer;text-decoration:underline;font-family:inherit;";
  rlBtn.textContent = "Reset to default (admin/admin123)";
  rlBtn.onclick = function() { if (confirm("Reset accounts?")) { localStorage.removeItem("sc6_admins"); STATE.admins = DEF_ADMINS; o.remove(); showNotif("✅ Reset done"); } };
  box.appendChild(rlBtn);
  o.appendChild(box); document.body.appendChild(o);
  setTimeout(function() { uI.focus(); }, 80);
}

// ── DOM Helpers ───────────────────────────────
function mkEl(tag, css, txt) {
  var e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (txt !== undefined && txt !== null) e.textContent = String(txt);
  return e;
}
function mkBtn(txt, bg, onclick, extraCss) {
  var b = document.createElement("button");
  b.style.cssText = "background:" + bg + ";color:white;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;" + (extraCss||"");
  b.textContent = txt;
  b.onclick = onclick;
  return b;
}
function mkRow(css) { var d = document.createElement("div"); d.style.cssText = "display:flex;align-items:center;gap:8px;flex-wrap:wrap;" + (css||""); return d; }
function mkCard(css) { var th=TH(); var d = document.createElement("div"); d.style.cssText = "background:"+th.bgCard+";border-radius:12px;border:1px solid "+th.border+";overflow:hidden;" + (css||""); return d; }
function mkChip(txt, bg, tx) { var s = document.createElement("span"); s.style.cssText = "background:"+bg+";color:"+tx+";border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;"; s.textContent = txt; return s; }
function mkBadge(txt, bg, tx) { var s = document.createElement("span"); s.style.cssText = "background:"+bg+";color:"+tx+";border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap;"; s.textContent = txt; return s; }
function mkInp(val, ph, type) { var e = document.createElement("input"); e.className = "inp"; e.type = type||"text"; e.placeholder = ph||""; e.value = val||""; return e; }
function mkSel(val, opts) {
  var e = document.createElement("select"); e.className = "inp";
  for (var i = 0; i < opts.length; i++) {
    var o = document.createElement("option"); o.value = opts[i][0]; o.textContent = opts[i][1];
    if (opts[i][0] === val) o.selected = true;
    e.appendChild(o);
  }
  return e;
}
function mkLbl(txt, inp) {
  var w = document.createElement("div");
  var lb = mkEl("label","font-size:11px;color:#64748B;display:block;margin-bottom:3px;",txt);
  w.appendChild(lb); w.appendChild(inp); return w;
}
function ap(parent) {
  for (var i = 1; i < arguments.length; i++) {
    var child = arguments[i];
    if (!child) continue;
    if (child.nodeType) parent.appendChild(child);
    else parent.appendChild(document.createTextNode(String(child)));
  }
  return parent;
}

function showNotif(msg, isErr) {
  var nb = document.getElementById("notif-bar");
  if (!nb) {
    nb = document.createElement("div"); nb.id = "notif-bar";
    nb.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9998;border-radius:10px;font-weight:600;font-size:12px;max-width:440px;text-align:center;padding:10px 20px;display:none;";
    document.body.appendChild(nb);
  }
  nb.style.background = isErr ? "#7F1D1D" : "#064E3B";
  nb.style.border = "1px solid " + (isErr ? "#EF4444" : "#10B981");
  nb.style.color = "white"; nb.style.display = "block"; nb.textContent = msg;
  if (STATE.notifTimer) clearTimeout(STATE.notifTimer);
  STATE.notifTimer = setTimeout(function() { nb.style.display = "none"; }, 3000);
}

  if (!app) return;
  app.innerHTML = "";
  app.appendChild(renderApp());
}

  ap(hdr, htop, tabsRow, statsRow);

  } catch(err) {

  }
  if (content) contentWrap.appendChild(content);

// ── Coverage Tab ──────────────────────────────
function renderCov() {
  var emps = STATE.emps, lreqs = STATE.lreqs, y = STATE.year, m = STATE.month;
  var cd = STATE.covData, cov = cd.cov;
  var dim = daysInM(y, m), fd = new Date(y, m, 1).getDay(), today = new Date();
  var tCrit = 0, tOT = 0;
  for (var d = 1; d <= dim; d++) {
    var cvD = cov[mkDs(y, m, d)];
    if (cvD) for (var ii = 0; ii < cvD.issues.length; ii++) {
      if (cvD.issues[ii].type === "critical") tCrit++; else tOT++;
    }
  }

  var wrap = document.createElement("div");

  // Nav
  var nav = mkRow("margin-bottom:12px;");
  var prevBtn = mkBtn("‹","#1E293B",function(){
    if (m===0){STATE.month=11;STATE.year=y-1;}else STATE.month=m-1;
    STATE.selDay=null;STATE.covData=computeCov(STATE.emps,STATE.lreqs,STATE.year,STATE.month);render();
  },"border:1px solid #334155;color:#F1F5F9;border-radius:8px;padding:7px 13px;font-size:17px;");
  var titleSpan = mkEl("span","font-size:16px;font-weight:800;color:#F8FAFC;min-width:130px;text-align:center;", MAR[m]+" "+y);
  var nextBtn = mkBtn("›","#1E293B",function(){
    if (m===11){STATE.month=0;STATE.year=y+1;}else STATE.month=m+1;
    STATE.selDay=null;STATE.covData=computeCov(STATE.emps,STATE.lreqs,STATE.year,STATE.month);render();
  },"border:1px solid #334155;color:#F1F5F9;border-radius:8px;padding:7px 13px;font-size:17px;");

  function mkStatBox(ic, v, lb, cl) {
    var b = document.createElement("div");
    b.style.cssText = "background:#1E293B;border:1px solid "+cl+"33;border-radius:8px;padding:4px 10px;display:flex;align-items:center;gap:5px;";
    ap(b, mkEl("span","font-size:13px;",ic));
    var d2 = document.createElement("div");
    ap(d2, mkEl("div","font-size:13px;font-weight:800;color:"+cl+";",String(v)));
    ap(d2, mkEl("div","font-size:9px;color:#64748B;",lb));
    b.appendChild(d2); return b;
  }
  ap(nav, prevBtn, titleSpan, nextBtn,
    mkStatBox("✅", dim*3-tCrit-tOT, "Full","#10B981"),
    mkStatBox("⏰", tOT, "OT", OT.tx),
    mkStatBox("⚠️", tCrit, "Short","#BE123C"));

  // ── Lock/Unlock button ───────────────────────────────────────
  var monthKey2 = y+"-"+m;
  var isMonthLocked = !!(STATE.lockedMonths && STATE.lockedMonths[monthKey2]);
  var lockBtn = document.createElement("button");
  lockBtn.style.cssText = "background:"+(isMonthLocked?"#7F1D1D":"#1E3A5F")+";color:"+(isMonthLocked?"#FCA5A5":"#93C5FD")+";border:1px solid "+(isMonthLocked?"#EF4444":"#3B82F6")+";border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;";
  lockBtn.innerHTML = (isMonthLocked?"🔒 Locked — Click to Unlock":"🔓 Lock Month");
  lockBtn.title = isMonthLocked
    ? "Month is LOCKED — auto-search is frozen. New leaves are recorded but coverage won't change automatically. Click to unlock."
    : "Lock this month's coverage — freezes all current OT/cover assignments. New leaves will show as needing manual attention.";
  lockBtn.onclick = function() {
    requireAdmin(function(){
      if (!STATE.lockedMonths) STATE.lockedMonths = {};
      if (isMonthLocked) {
        // UNLOCK: remove frozen snapshot entries from STATE.otAssign
        var unlockSnap = STATE.lockedMonths[monthKey2] && STATE.lockedMonths[monthKey2].snap;
        if (unlockSnap) {
          for (var uk in unlockSnap) {
            // Only remove if the value is still the frozen object (not a new manual assignment)
            if (STATE.otAssign[uk] && typeof STATE.otAssign[uk] === "object" && STATE.otAssign[uk].id === (unlockSnap[uk]&&unlockSnap[uk].id)) {
              delete STATE.otAssign[uk];
            }
          }
          sLS("sc6_otassign", STATE.otAssign);
        }
        delete STATE.lockedMonths[monthKey2];
        sLS("sc6_lockedmonths", STATE.lockedMonths);
        STATE.covData = computeCov(STATE.emps, STATE.lreqs, STATE.year, STATE.month);
        showNotif("🔓 "+MAR[m]+" "+y+" unlocked — auto-search resumed");
      } else {
        // LOCK: build the snapshot from the CURRENT computed coverage results
        // (STATE.covData.cov), not just STATE.otAssign. This captures ALL
        // cover assignments — auto-selected AND manually overridden — so
        // that the full 44 OT assignments are preserved, not just the ones
        // the admin picked by hand.
        var snap = {};
        var prefix2 = mkDs(y,m,1).slice(0,7); // "YYYY-MM"

        // Helper: freeze employee data at time of lock so future role/name
        // changes don't affect this locked month.
        function freezeEmp(emp) {
          return {id:emp.id, name:emp.name, role:emp.role, group:emp.group};
        }

        var covSnapshot = STATE.covData && STATE.covData.cov;
        if (covSnapshot) {
          for (var snapDs in covSnapshot) {
            if (snapDs.indexOf(prefix2) !== 0) continue;
            var dayIssues = covSnapshot[snapDs].issues || [];
            for (var sii = 0; sii < dayIssues.length; sii++) {
              var sIss = dayIssues[sii];
              if (sIss.emp && (sIss.type === "cover" || sIss.type === "needsManual")) {
                var snapKey = snapDs+":"+sIss.shift+":"+sIss.slotId;
                // Store full frozen employee object — not just the ID
                snap[snapKey] = freezeEmp(sIss.emp);
              }
            }
          }
        }
        // Also preserve manual overrides from STATE.otAssign
        for (var ok in STATE.otAssign) {
          if (ok.indexOf(prefix2) !== 0) continue;
          var okVal = STATE.otAssign[ok];
          if (okVal === "__none__") {
            snap[ok] = "__none__"; // keep sentinel as-is
          } else if (STATE.emps[okVal]) {
            snap[ok] = freezeEmp(STATE.emps[okVal]);
          }
        }
        // Also record which dates had leaves AT TIME OF LOCKING so we can
        // detect NEW leaves added after the lock (those days get a fresh
        // auto-search for that day only).
        var leaveDatesAtLock = {};
        for (var lri = 0; lri < STATE.lreqs.length; lri++) {
          var lr = STATE.lreqs[lri];
          if (lr.status !== "approved") continue;
          var lrDates = rangeD(lr.from, lr.to);
          for (var lrdi = 0; lrdi < lrDates.length; lrdi++) {
            if (lrDates[lrdi].indexOf(prefix2) === 0) leaveDatesAtLock[lrDates[lrdi]] = true;
          }
        }
        STATE.lockedMonths[monthKey2] = {
          snap: snap,
          leaveDatesAtLock: leaveDatesAtLock
        };
        // Write frozen assignments into STATE.otAssign so computeCov finds
        // a manualId for EVERY covered slot — preventing ANY auto-search
        // re-run even if employee roles/names change after locking.
        for (var sk_wr in snap) {
          if (snap[sk_wr] !== "__none__") {
            // Only write if not already manually overridden after the lock
            if (!STATE.otAssign[sk_wr]) STATE.otAssign[sk_wr] = snap[sk_wr];
          }
        }
        sLS("sc6_otassign", STATE.otAssign);
        sLS("sc6_lockedmonths", STATE.lockedMonths);
        STATE.covData = computeCov(STATE.emps, STATE.lreqs, STATE.year, STATE.month);
        showNotif("🔒 "+MAR[m]+" "+y+" locked — "+Object.keys(snap).length+" assignments frozen");
      }
      render();
    });
  };
  nav.appendChild(lockBtn);

  // Locked month banner
  if (isMonthLocked) {
    var lockBanner = mkEl("div","background:#7F1D1D33;border:1px solid #EF444466;border-radius:9px;padding:8px 13px;margin-bottom:10px;font-size:11px;color:#FCA5A5;font-weight:600;",
      "🔒 "+MAR[m]+" "+y+" is LOCKED — coverage is frozen. New leaves are recorded but won't trigger auto-reassignment. Use the coverage card selectors to manually adjust any slot, then unlock when ready.");
    wrap.appendChild(lockBanner);
  }

  wrap.appendChild(nav);

  // Calendar
  var dayHdr = document.createElement("div");
  dayHdr.style.cssText = "display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;";
  for (var di = 0; di < DAR.length; di++) {
    ap(dayHdr, mkEl("div","text-align:center;font-size:10px;color:#64748B;padding:3px 0;font-weight:700;",DAR[di]));
  }
  wrap.appendChild(dayHdr);

  var cal = document.createElement("div");
  cal.style.cssText = "display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:13px;";
  for (var ei = 0; ei < fd; ei++) cal.appendChild(document.createElement("div"));
  for (var dy = 1; dy <= dim; dy++) {
    (function(day) {
      var ds2 = mkDs(y, m, day), dw = dowN(y, m, day);
      var isT = today.getDate()===day && today.getMonth()===m && today.getFullYear()===y;
      var isS = STATE.selDay === day;
      var cv = cov[ds2], crit = 0, ot = 0;
      if (cv) for (var ii3 = 0; ii3 < cv.issues.length; ii3++) {
        if (cv.issues[ii3].type === "critical") crit++; else ot++;
      }
      var ok = crit === 0 && ot === 0;
      var bc = crit>0 ? "#BE123C" : ot>0 ? OT.tx : ok ? "#10B981" : "#334155";
      var dc = document.createElement("div");
      dc.style.cssText = "background:"+(isS?"#1D4ED8":isT?"#172554":"#111827")+";border:2px solid "+(isS?"#3B82F6":bc)+";border-radius:8px;padding:4px 3px;cursor:pointer;min-height:50px;";
      ap(dc, mkEl("div","font-size:11px;font-weight:800;color:"+(isT?"#F59E0B":(dw===5||dw===6)?"#FCA5A5":"#E2E8F0")+";margin-bottom:2px;",String(day)));
      var bd = document.createElement("div"); bd.style.cssText = "display:flex;flex-direction:column;gap:1px;";
      if (ok) { var okb = mkEl("div","font-size:8px;background:#10B98122;color:#10B981;border-radius:3px;padding:1px 3px;font-weight:700;","✅"); bd.appendChild(okb); }
      if (ot > 0) { var otb = mkEl("div","font-size:8px;background:"+OT.bg+";color:"+OT.tx+";border-radius:3px;padding:1px 3px;font-weight:700;","⏰"+ot); bd.appendChild(otb); }
      if (crit > 0) { var crb = mkEl("div","font-size:8px;background:#BE123C22;color:#FB7185;border-radius:3px;padding:1px 3px;font-weight:700;","⚠️"+crit); bd.appendChild(crb); }
      dc.appendChild(bd);
      dc.onclick = function() { STATE.selDay = (STATE.selDay===day?null:day); render(); };
      cal.appendChild(dc);
    })(dy);
  }
  wrap.appendChild(cal);

  // Day detail
  if (STATE.selDay) {
    var ds3 = mkDs(y, m, STATE.selDay), selCov = cov[ds3];
    if (!selCov) return wrap;
    var detail = mkCard("");
    var dh = mkRow("background:#111827;padding:10px 13px;border-bottom:1px solid #334155;justify-content:space-between;");
    ap(dh, mkEl("div","font-size:13px;font-weight:800;color:#F8FAFC;",STATE.selDay+" "+MAR[m]+" "+y+" — "+DAR[dowN(y,m,STATE.selDay)]));
    var dhb = mkRow("");
    if (!selCov.issues.length) dhb.appendChild(mkBadge("✅ All Covered","#064E3B","#34D399"));
    var hasCrit2 = selCov.issues.some(function(i){return i.type==="critical";});
    var hasNeedsManual2 = selCov.issues.some(function(i){return i.type==="needsManual";});
    var hasOT2 = selCov.issues.some(function(i){return i.type==="cover";});
    if (hasCrit2) dhb.appendChild(mkBadge("⚠️ Short","#7F1D1D","#FCA5A5"));
    if (hasNeedsManual2) dhb.appendChild(mkBadge("✋ Needs Pick","#78350F","#FCD34D"));
    if (hasOT2) dhb.appendChild(mkBadge("⏰ OT",OT.bg,OT.tx));
    dh.appendChild(dhb);
    detail.appendChild(dh);

    // Issues
    if (selCov.issues.length) {
      var issWrap = mkEl("div","padding:10px 12px;border-bottom:1px solid #334155;");
      ap(issWrap, mkEl("div","font-size:11px;font-weight:700;color:#94A3B8;margin-bottom:6px;","📋 Actions:"));
      for (var isi = 0; isi < selCov.issues.length; isi++) {
        (function(iss) {
          var isCrit = iss.type === "critical";
          var isNeedsManual = iss.type === "needsManual";

function openTransferDatePicker(eid, emp, fromGrp, toGrp, newGi, maxOrd) {
  var old = document.getElementById("tr-ov"); if (old && old.parentNode) old.parentNode.removeChild(old);
  var container = document.body || document.documentElement;

  var t2 = new Date(); dateInp.value = mkDs(t2.getFullYear(),t2.getMonth(),t2.getDate());
  dateBox.appendChild(mkLbl("Transfer Start Date:", dateInp));
  box.appendChild(dateBox);

  // ── Transfer type selector ──────────────────────────────────────
  var typeRow = mkRow("gap:8px;margin-bottom:10px;");

  var permBtn2 = document.createElement("button");
  permBtn2.textContent = "🔁 Permanent Transfer";
  permBtn2.style.cssText = "flex:1;padding:9px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid #7C3AED;background:#7C3AED;color:white;font-family:inherit;";

  var tempBtn2 = document.createElement("button");
  tempBtn2.textContent = "📅 Temporary (by date)";
  tempBtn2.style.cssText = "flex:1;padding:9px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid #334155;background:transparent;color:#94A3B8;font-family:inherit;";

  var isTempTransfer = false;
  permBtn2.onclick = function(e){e.preventDefault();isTempTransfer=false;permBtn2.style.background="#7C3AED";permBtn2.style.borderColor="#7C3AED";permBtn2.style.color="white";tempBtn2.style.background="transparent";tempBtn2.style.borderColor="#334155";tempBtn2.style.color="#94A3B8";endDateBox.style.display="none";recalc();};
  tempBtn2.onclick = function(e){e.preventDefault();isTempTransfer=true;tempBtn2.style.background="#0369A1";tempBtn2.style.borderColor="#0EA5E9";tempBtn2.style.color="white";permBtn2.style.background="transparent";permBtn2.style.borderColor="#334155";permBtn2.style.color="#94A3B8";endDateBox.style.display="block";recalc();};

  ap(typeRow, permBtn2, tempBtn2);
  box.appendChild(typeRow);

  // Type description
  var typeDesc = mkEl("div","font-size:10px;color:#64748B;margin-bottom:10px;padding:6px 9px;background:#0F172A;border-radius:6px;",
    "🔁 Permanent: employee moves to Group "+toGrp+" permanently (group changes in Staff)\n📅 Temporary: schedule follows Group "+toGrp+" for the period only — stays in Group "+fromGrp+" in Staff");
  typeDesc.style.whiteSpace = "pre-line";
  box.appendChild(typeDesc);

  var endDateBox = mkEl("div","margin-bottom:12px;display:none;");
  var endDateInp = mkInp("","","date");
  endDateBox.appendChild(mkLbl("End Date (last day in Group "+toGrp+" — auto-returns to Group "+fromGrp+"):", endDateInp));
  box.appendChild(endDateBox);

  // Back-compat: endToggle shim so recalc() still works
  var endToggle = {checked: false, __defineGetter__: undefined};
  Object.defineProperty(endToggle, 'checked', {
    get: function(){return isTempTransfer;},
    set: function(v){isTempTransfer=v;}
  });

  var infoBox2 = mkEl("div","background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:#93C5FD;line-height:1.8;");
  infoBox2.textContent = "Select a date...";
  box.appendChild(infoBox2);

  var oldGi = emp.gi; // current gi = old group before transfer

  function recalc() {
    var sd = dateInp.value; if (!sd) return null;
    var y2=STATE.year, m2=STATE.month, dim2=daysInM(y2,m2);
    var lmap2 = buildLmap(STATE.lreqs);
    var workedOld = 0, workedNew = 0;
    var schedulePreview = [];
    for (var d4 = 1; d4 <= dim2; d4++) {
      var ds4 = mkDs(y2,m2,d4);
      var dv4 = doy(new Date(y2,m2,d4));
      var lt4 = lmapGet(lmap2,eid,ds4);
      var isOnLeave = lt4 && lt4 !== "overtime";
      if (ds4 < sd) {
        // Before transfer: use old group
        var sh4 = shiftFor(oldGi, dv4);
        if (sh4 !== "off" && !isOnLeave) workedOld++;
      } else {
        // From transfer date: use new group (handle General gi=-1)
        var sh4b = (newGi < 0) ? getGeneralShift(ds4) : shiftFor(newGi, dv4);
        if (sh4b !== "off" && !isOnLeave) workedNew++;
      }
    }
    var total = workedOld + workedNew;
    var owed = Math.max(0, total - MAX_WORK);
    var col = total > MAX_WORK ? "#F87171" : total === MAX_WORK ? "#FCD34D" : "#34D399";

    var html2 = "<div style='margin-bottom:6px;font-weight:700;color:#60A5FA;'>📊 Working Days Calculation:</div>";
    html2 += "<div>Before "+fmtD(sd)+" (Group "+fromGrp+"): <b style='color:#E2E8F0'>"+workedOld+" days</b></div>";
    html2 += "<div>From "+fmtD(sd)+" (Group "+toGrp+"): <b style='color:#E2E8F0'>"+workedNew+" days</b></div>";
    html2 += "<div>Total projected: <b style='color:"+col+"'>"+total+" / "+MAX_WORK+"</b></div>";
    if (owed > 0) {
      html2 += "<div style='margin-top:7px;padding:6px 9px;background:#064E3B33;border-radius:6px;border:1px solid #10B98144;'>";
      html2 += "<b style='color:#34D399'>✅ "+owed+" compensatory OFF day"+(owed!==1?"s":"")+" will be granted (not C-OFF)</b><br>";
      html2 += "<span style='color:#6EE7B7;font-size:10px;'>These days will appear as C-OFF in the schedule automatically</span></div>";
    } else {
      html2 += "<div style='margin-top:6px;padding:5px 8px;background:#064E3B22;border-radius:6px;color:#6EE7B7;'>✅ No compensation needed</div>";
    }
    infoBox2.innerHTML = html2;
    return {sd:sd, owed:owed, workedOld:workedOld, workedNew:workedNew, total:total};
  }
  dateInp.onchange = recalc; recalc();

  var btnRow3 = mkRow("gap:8px;");
  ap(btnRow3,
    mkBtn("✅ Confirm Transfer","#7C3AED",function(){
      var calc = recalc(); if (!calc || !calc.sd) return;
      var hasEndDate = endToggle.checked;
      var endDate = hasEndDate ? endDateInp.value : null;
      if (hasEndDate && !endDate) { showNotif("⚠️ Pick an end date, or uncheck the temporary-transfer box", true); return; }
      if (hasEndDate && endDate <= calc.sd) { showNotif("⚠️ End date must be after the start date", true); return; }
      requireAdmin(function(){
        if(!STATE.transferLog) STATE.transferLog={};
        // Store oldGi so schedule before transfer date uses old rotation,
        // and optionally an endDate so the employee automatically reverts
        // to their original group's rotation once that date passes — no
        // manual follow-up action needed.
        STATE.transferLog[eid]={
          name:emp.name, fromGroup:fromGrp, toGroup:toGrp,
          startDate:calc.sd,
          endDate:endDate,   // null = permanent transfer; a date = auto-revert after this day
          oldGi:oldGi,   // CRITICAL: old group index for pre-transfer days
          newGi:newGi,   // new group index for post-transfer days
          daysOwed:calc.owed,
          workedOld:calc.workedOld, workedNew:calc.workedNew
        };
        sLS("sc6_transferlog",STATE.transferLog);

        // Auto-create C-OFF compensation leaves if days owed > 0
        if (calc.owed > 0) {
          // Find calc.owed OFF days in the new group's schedule after transfer date
          // and mark them as C-OFF leaves
          var lmap2b = buildLmap(STATE.lreqs);
          var offCount = 0;
          var y2b = STATE.year, m2b = STATE.month, dim2b = daysInM(y2b,m2b);
          for (var dc = 1; dc <= dim2b && offCount < calc.owed; dc++) {
            var dsc = mkDs(y2b,m2b,dc);
            if (dsc < calc.sd) continue; // only after transfer
            if (hasEndDate && dsc > endDate) continue; // not past the temporary transfer's end
            var dvc = doy(new Date(y2b,m2b,dc));
            var shc = (newGi < 0) ? getGeneralShift(dsc) : shiftFor(newGi, dvc);
            // Pick working days (not already off, not on leave) and grant C-OFF
            if (shc !== "off" && !lmapGet(lmap2b,eid,dsc)) {
              STATE.lreqs.push({
                id:"off"+Date.now()+offCount,
                empId:eid, from:dsc, to:dsc,
                lt:"annual", reason:"Compensatory OFF from Group "+fromGrp+" → "+toGrp+" transfer (extra work days)",
                status:"approved", requestedAt:new Date().toISOString()
              });
              offCount++;
            }
          }
          sLS("sc6_lreqs",STATE.lreqs);
        }

        // For a PERMANENT transfer (no end date), update the employee's
        // group/gi right away so Staff tab and everywhere else reflects it
        // immediately. For a TEMPORARY transfer (has an end date), leave
        // their group/gi as-is — getEmpEffectiveShift() already honors the
        // startDate/endDate window from transferLog, and once the end date
        // passes they automatically resume their ORIGINAL group's rotation
        // with no further action needed.
        if (!hasEndDate) {
          STATE.emps[eid].group = toGrp;
          STATE.emps[eid].gi = newGi;
          STATE.emps[eid].order = maxOrd;
          sLS("sc6_emps",STATE.emps);
        }

        STATE.transferEmpId = null; STATE.transferMode = false;
        STATE.covData = computeCov(STATE.emps,STATE.lreqs,STATE.year,STATE.month);
        var msg = "✅ "+emp.name+" → Group "+toGrp+" from "+fmtD(calc.sd);
        if (hasEndDate) msg += " until "+fmtD(endDate)+" (auto-reverts)";
        if (calc.owed > 0) msg += " · "+calc.owed+" compensatory OFF day"+(calc.owed!==1?"s":"")+" granted";
        showNotif(msg); o.remove(); render();
      });
    },"flex:1;border-radius:8px;padding:10px;font-size:13px;font-weight:700;"),
    mkBtn("Cancel","#374151",function(){o.remove();},"border-radius:8px;padding:10px 13px;font-size:12px;color:#94A3B8;")
  );
  box.appendChild(btnRow3);
  o.appendChild(box); container.appendChild(o);
  o.onclick = function(e){if(e.target===o)o.remove();};
}

function renderRules() {

      mkEl("div","font-size:11px;color:#64748B;margin-top:2px;","When SL/EL/OL approved → shows copyable notification text")
    );

    var emailBody = mkEl("div","padding:13px;");

    var curMgrName = (STATE.rules && STATE.rules.notifyManagerName) || "";
    var mgrRow = mkRow("gap:8px;align-items:center;margin-bottom:8px;");

    wrap.appendChild(emailCard);
  })();

  // Lets the admin pick NAMED individuals (regardless of their own title)

            (entryFrom?fmtD(entryFrom):"…")+" → "+(entryTo?fmtD(entryTo):"…")));
        } else {
          ap(lRow, mkEl("span","font-size:9px;color:#64748B;","always active"));
        }
        var rmBtn2 = document.createElement("button");
        rmBtn2.style.cssText = "background:#7F1D1D22;border:1px solid #EF4444;color:#F87171;border-radius:5px;padding:2px 7px;font-size:9px;cursor:pointer;font-family:inherit;";
        rmBtn2.textContent = "✕";
        rmBtn2.onclick = function() {
          requireAdmin(function(){
            STATE.linkedEmployees[role4].splice(entryIdx, 1);

            STATE.covData = computeCov(STATE.emps, STATE.lreqs, STATE.year, STATE.month);
            showNotif("Removed "+linkedEmp.name+" from "+info4.sh+"'s pool");
            render();
          });
        };
        lRow.appendChild(rmBtn2);
        linkedList.appendChild(lRow);
      });
      linkBox.appendChild(linkedList);

      // Add-person controls: pick a person + optional from/to date range.
      // Leaving dates blank = always active (until manually removed).

  if (!pgGroups.length || pgGroups.every(function(g){return !g.emps||g.emps.filter(function(id){return id&&STATE.emps[id];}).length===0;})) {
    showNotif("No employees configured for "+MAR[m]+" "+y, true); return;

  var lmap_g = STATE.covData ? STATE.covData.lmap : buildLmap(STATE.lreqs);

  // OT count from covData — covers auto, manual, and slotAssign OT
  var cgOtByEmp = {};

  var pg_prefix = mkDs(y,m,1).slice(0,7);

    for (var pgIi=0;pgIi<pgDay.issues.length;pgIi++){

          var eff4=getEmpEffectiveShift(STATE.emps[sid4],pgDs,doy(new Date(pgDs)));
          if(eff4==="off")cgOtByEmp[sid4]=(cgOtByEmp[sid4]||0)+1;
        });
      });
    }
  }

  var td_g = "border:1px solid #aaa;padding:4px 5px;font-size:7pt;";

    activeEmps.forEach(function(emp8, ei8) {

      for(var cgd=1;cgd<=dim_g;cgd++){

      }
      var cgOt=cgOtByEmp[emp8.id]||0;

      // AL Left

      var cgAlUsed=0;
      STATE.lreqs.forEach(function(lr){
        if(lr.empId!==emp8.id||lr.status!=='approved'||lr.lt!=='annual')return;

        rangeD(lr.from,lr.to).forEach(function(ds){
          if(shiftFor(emp8.gi,doy(parseDs(ds)))!=='off')cgAlUsed++;
        });
      });
      var cgAlLeft=cgAlQuota-cgAlUsed;

      // C-OFF Left
      var cgCoffFromH=0,cgCoffUsed=0;
      var cgCoffManual=(STATE.leaveBalance&&STATE.leaveBalance[emp8.id]&&STATE.leaveBalance[emp8.id].coffBonus)||0;
      if(emp8.group!=="G"&&STATE.holidays){
        var cgLmH=lmap_g;
        var CTYP2=["annual","coff","paternal"];
        STATE.holidays.forEach(function(h){
          rangeD(h.from,h.to).forEach(function(hds){
            var heff=getEmpEffectiveShift(emp8,hds,doy(parseDs(hds)));
            var hlt=lmapGet(cgLmH,emp8.id,hds);
            if(hlt&&CTYP2.indexOf(hlt)>=0)cgCoffFromH++;
            else if(hlt==="overtime")cgCoffFromH++;
            else if(heff==="off"&&!hlt)cgCoffFromH++;
          });
        });
      }
      STATE.lreqs.forEach(function(lr){
        if(lr.empId!==emp8.id||lr.status!=='approved'||lr.lt!=='coff')return;
        if(parseInt(lr.from.slice(0,4))!==y)return;
        rangeD(lr.from,lr.to).forEach(function(ds){
          if(shiftFor(emp8.gi,doy(parseDs(ds)))!=='off')cgCoffUsed++;

      });
      var cgCoffLeft=(cgCoffFromH+cgCoffManual)-cgCoffUsed;

      var rc8=getR(emp8.role);

      html+="<tr style='background:"+rowBg+"'>";
      html+="<td style='"+td_g+"text-align:left;font-weight:bold;'>"+emp8.name+"</td>";
      html+="<td style='"+td_g+"text-align:center;background:"+rc8.cl+"22;color:"+rc8.cl+";font-weight:bold;'>"+getRTitle(rc8.sh)+"</td>";
      html+="<td style='"+td_g+"text-align:center;color:#64748B;'>"+emp8.group+"</td>";
      cgLeaveKeys.forEach(function(k){
        var v=cgCounts[k]||0;
        var lc_k=LC[k]||{};
        html+="<td style='"+td_g+"text-align:center;"+(v>0?"background:"+(lc_k.pbg||"#E5E7EB")+";color:"+(lc_k.tx||"#1E293B")+";font-weight:bold;":"color:#CBD5E1;")+"'>"+v+"</td>";
      });
