      html+="<td style='"+td_g+"text-align:center;font-weight:bold;color:"+(cgCoffLeft<0?"#EF4444":cgCoffLeft>0?"#0E7490":"#94A3B8")+"'>"+(cgCoffTotal>0?cgCoffLeft+"d":"—")+"</td>";
      html+="</tr>";
    });
    html += "</tbody></table></div>";
  }
  html += "</body></html>";
  var w=window.open("","_blank","width=800,height=900");
  if(w){w.document.write(html);w.document.close();}else showNotif("⚠️ Allow popups",true);
}

function doExport() {
  var y3=STATE.year, m3=STATE.month, emps=STATE.emps, dim3=daysInM(y3,m3);
  var cd3e=STATE.covData||computeCov(STATE.emps,STATE.lreqs,STATE.year,STATE.month);
  var lmap4=cd3e.lmap;
  var cov3e=cd3e.cov;
  // Build OT cover map for CSV
  var otMap3={};
  for(var ds_e in cov3e){
    var cd3ev=cov3e[ds_e];
    if(!cd3ev||!cd3ev.issues)continue;
    for(var ii3=0;ii3<cd3ev.issues.length;ii3++){
      var is3=cd3ev.issues[ii3];
      if(is3.type==="cover"&&is3.emp){
        if(!otMap3[is3.emp.id])otMap3[is3.emp.id]={};
        otMap3[is3.emp.id][ds_e]=is3.shift||"morning";
      }
    }
  }
  var rows=[], dArr=[], dshArr=[];
  for(var d6=1;d6<=dim3;d6++){dArr.push(d6);dshArr.push(DSH[dowN(y3,m3,d6)]);}
  rows.push(["Shift Schedule — "+MAR[m3]+" "+y3].concat(new Array(dim3+1).fill("")));
  rows.push(["Name","Role"].concat(dArr));
  rows.push(["",""].concat(dshArr));
  for(var gi5=0;gi5<GR.length;gi5++){
    var g3=GR[gi5], ge3=[];
    for(var k8 in emps)if(emps[k8].group===g3)ge3.push(emps[k8]);
    ge3.sort(function(a,b){return a.order-b.order;});
    rows.push(["Group "+g3].concat(new Array(dim3+1).fill("")));
    for(var ei5=0;ei5<ge3.length;ei5++){
      var emp9=ge3[ei5], r2=[emp9.name,getRTitle(getR(emp9.role).sh)];
      for(var d7=1;d7<=dim3;d7++){
        var ds6=mkDs(y3,m3,d7), lt3=lmapGet(lmap4,emp9.id,ds6);
        var dv5=doy(new Date(y3,m3,d7));
        var isOTc=otMap3[emp9.id]&&otMap3[emp9.id][ds6];
        var cell;
        if(lt3) cell=lt3==="overtime"?"OT":(LC[lt3]?LC[lt3].code:"AL");
        else if(isOTc){
          // Show shift code of covered shift (with asterisk to indicate OT)
          var otSh3=otMap3[emp9.id][ds6];
          cell=(SC[otSh3]||SC.morning).code+"*";  // e.g. "M*" = morning OT
        }
        else cell=(SC[getEmpEffectiveShift(emp9,ds6,dv5)]||SC.off).code;
        r2.push(cell);
      }
      rows.push(r2);
    }
  }
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c||"").replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
  // "sep=," as the very first line forces Excel to use comma as the field
  // delimiter regardless of the system's regional settings — without this,
  // Excel on an Arabic-locale Windows machine often defaults to semicolon
  // as the delimiter and dumps the entire CSV into a single column A.
  var blob=new Blob(["\uFEFFsep=,\r\n"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download="Schedule-"+MAR[m3]+"-"+y3+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showNotif("✅ Downloaded");
}

function doPrint() {
  var y4=STATE.year, m4=STATE.month, emps=STATE.emps, dim4=daysInM(y4,m4);
  // Always recompute so newly added employees (incl. General G) appear
  var cd4=computeCov(STATE.emps,STATE.lreqs,y4,m4);
  STATE.covData=cd4;
  var lmap5=cd4.lmap;
  var cov4=cd4.cov;

  // Build OT cover map: empId -> {dateStr: shiftKey}
  // Store the SHIFT they covered (morning/evening/night) for correct display
  var otCoverMap={};
  for(var ds_ot in cov4){
    var cvDay4=cov4[ds_ot];
    if(!cvDay4||!cvDay4.issues)continue;
    for(var ii4=0;ii4<cvDay4.issues.length;ii4++){
      var iss4=cvDay4.issues[ii4];
      if(iss4.type==="cover"&&iss4.emp){
        if(!otCoverMap[iss4.emp.id])otCoverMap[iss4.emp.id]={};
        otCoverMap[iss4.emp.id][ds_ot]=iss4.shift||"morning";
      }
    }
  }
  // Also mark slotAssign employees who were OFF on that day as OT
  // (they were manually assigned to work on their rest day via the slot
  // reassignment feature — this must print in yellow just like auto-OT).
  if (STATE.slotAssign) {
    for (var saKey_p in STATE.slotAssign) {
      var saDate_p = saKey_p.substring(0,10);
      var saShift_p = saKey_p.split(":")[1];
      var saEmpId_p = STATE.slotAssign[saKey_p];
      if (!emps[saEmpId_p] || !saDate_p || !saShift_p) continue;
      var saEmp_p = emps[saEmpId_p];
      var saDv_p = doy(new Date(saDate_p));
      var saEff_p = getEmpEffectiveShift(saEmp_p, saDate_p, saDv_p);
      if (saEff_p === "off") {
        // Off-day manual assignment = OT — paint yellow in print
        if (!otCoverMap[saEmpId_p]) otCoverMap[saEmpId_p] = {};
        if (!otCoverMap[saEmpId_p][saDate_p]) otCoverMap[saEmpId_p][saDate_p] = saShift_p;
      }
    }
  }

  var SPBG={morning:"#FFFFFF",evening:"#FFFFFF",night:"#FFFFFF",off:"#E2E8F0"};
  var OT_BG="#FFD700", OT_TX="#000000";
  var td="border:1px solid #aaa;padding:1px 2px;text-align:center;font-size:6pt;font-weight:bold;";
  var th=""+td+"background:#1E3A8A;color:white;";
  var html="<!DOCTYPE html><html><head><meta charset='UTF-8'/><style>"
    +"*{margin:0;padding:0;box-sizing:border-box;}"
    +"body{background:white;font-family:Arial;padding:8px;}"
    // Suppress the browser's built-in header/footer (which shows "about:blank"
    // and the URL) when the user prints from the popup window.
    +"@page{size:A4 landscape;margin:5mm;}"
    +"@media print{"
    +"  @page{margin:5mm;}" // keep layout margins
    +"  .no-print{display:none!important;}" // hide Print/Close buttons + OT label
    +"}"
    +"td,th{-webkit-print-color-adjust:exact;print-color-adjust:exact;}"
    +"</style></head><body>";
  // Print/Close buttons and the OT label are wrapped in .no-print so they
  // disappear when the user actually sends to a printer or saves as PDF.
  html+="<div class='no-print' style='display:flex;gap:8px;margin-bottom:8px'>"
    +"<button onclick='window.print()' style='background:#3B82F6;color:white;border:none;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer'>🖨️ Print</button>"
    +"<button onclick='window.close()' style='background:#EF4444;color:white;border:none;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer'>✕ Close</button>"
    +"<span style='font-size:10px;color:#374151;align-self:center'>OT=Overtime cover</span>"
    +"</div>";
  html+="<div style='background:#1E3A8A;color:white;text-align:center;padding:5px;font-size:10pt;font-weight:bold;margin-bottom:5px;border-radius:4px'>Shift Schedule — "+MAR[m4]+" "+y4+"</div>";
  // Legend
  html+="<div style='display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap'>";
  var leg4=[
    ["M Morning","#FFFFFF","#000000"],["E Evening","#FFFFFF","#000000"],["N Night","#FFFFFF","#000000"],
    ["OFF","#E2E8F0","#475569"],["AL Annual",LC.annual.pbg,LC.annual.tx],["SL Sick",LC.sick.pbg,LC.sick.tx],
    ["M/E/N OT","#FFD700","#000000"]
  ];
  for(var li4=0;li4<leg4.length;li4++){
    html+="<span style='background:"+leg4[li4][1]+";color:"+leg4[li4][2]+";border-radius:3px;padding:1px 5px;font-size:6pt;font-weight:bold;border:1px solid #aaa'>"+leg4[li4][0]+"</span>";
  }
  html+="</div>";
  html+="<div style='overflow-x:auto'><table style='border-collapse:collapse;width:100%'><thead><tr>";
  html+="<th style='"+th+"text-align:left;min-width:80px'>Name</th><th style='"+th+"min-width:26px'>Role</th>";
  for(var d8=1;d8<=dim4;d8++){var dw2=dowN(y4,m4,d8);html+="<th style='"+th+"min-width:15px;background:"+(dw2===5||dw2===6?"#7F1D1D":"#1E3A8A")+"'>"+d8+"</th>";}
  html+="</tr><tr><th style='"+th+"background:#374151'></th><th style='"+th+"background:#374151'></th>";
  for(var d9=1;d9<=dim4;d9++){var dw3=dowN(y4,m4,d9);html+="<th style='"+th+"font-size:5pt;background:"+(dw3===5||dw3===6?"#7F1D1D":"#374151")+"'>"+DSH[dw3]+"</th>";}
  html+="</tr></thead><tbody>";
  for(var gi6=0;gi6<GR.length;gi6++){
    var g4=GR[gi6], ge4=[];
    // Use the employee's group AS OF the printed month (respecting transfers)
    var printMonthDs = mkDs(y4,m4,1); // first day of printed month
    for(var k9 in emps){
      var emp9=emps[k9];
      if(emp9.group==="G")continue; // General shown separately at bottom
      var tr9=STATE.transferLog&&STATE.transferLog[emp9.id];
      var emp9Group;
      if(tr9&&tr9.startDate){
        if(printMonthDs<tr9.startDate) emp9Group=GR[tr9.oldGi];
        else if(tr9.endDate&&printMonthDs>tr9.endDate) emp9Group=GR[tr9.oldGi];
        else emp9Group=GR[tr9.newGi];
      } else {
        emp9Group=emp9.group;
      }
      if(emp9Group===g4) ge4.push(emp9);
    }
    ge4.sort(function(a,b){return a.order-b.order;});
    html+="<tr><td colspan='"+(2+dim4)+"' style='"+td+"background:#D1D5DB;font-weight:bold;text-align:left;padding-left:5px;font-size:7pt'>Group "+g4+" ("+ge4.length+")</td></tr>";
    for(var ei6=0;ei6<ge4.length;ei6++){
      var emp10=ge4[ei6];
      var emp10Role=getEmpRoleAtMonth(emp10,y4,m4);
      html+="<tr><td style='"+td+"text-align:left;padding-left:2px;font-size:5.5pt;background:#E2E8F0;font-weight:bold;color:#1E293B'>"+emp10.name+"</td><td style='"+td+"font-size:5pt;background:#CBD5E1;font-weight:bold;text-align:center;color:#0F172A'>"+getRTitle(getR(emp10Role).sh)+"</td>";
      for(var d10=1;d10<=dim4;d10++){
        var ds7=mkDs(y4,m4,d10), lt4=lmapGet(lmap5,emp10.id,ds7), dv6=doy(new Date(y4,m4,d10));
        var code3,bg3,txColor3="#000";
        if(lt4){
          // On approved leave
          code3=lt4==="overtime"?"OT":(LC[lt4]?LC[lt4].code:"AL");
          bg3=lt4==="overtime"?OT_BG:(LC[lt4]?LC[lt4].pbg:"#FFD700");
        } else if(otCoverMap[emp10.id]&&otCoverMap[emp10.id][ds7]){
          // Covering as OT on their OFF day — show shift code + yellow bg
          var otShift=otCoverMap[emp10.id][ds7];
          var otSC=SC[otShift]||SC.morning;
          code3=otSC.code;  // M, E, or N
          bg3=OT_BG;        // yellow background = OT
          txColor3=OT_TX;   // amber text
        } else {
          var eff2=getEmpEffectiveShift(emp10,ds7,dv6);
          code3=(SC[eff2]||SC.off).code;
          bg3=SPBG[eff2]||"#E2E8F0";
        }
        html+="<td style='"+td+"background:"+bg3+";color:"+txColor3+"'>"+code3+"</td>";
      }
      html+="</tr>";
    }
  }
  // ── Daily count rows ──────────────────────────────────────
  // IMPORTANT: a shift showing "4/4" must mean all 4 REQUIRED ROLES
  // (SCE, CRE, FE1, FE2) are filled — by someone present OR by an OT/
  // internal-promotion cover. A raw headcount of 4 that's missing the
  // actual SCE (e.g. 4 FEs and no SCE) must NOT be shown as complete.
  // So we derive these counts directly from the coverage engine's
  // per-slot "tag", not by counting bodies.
  var countLabels=[["Morning","morning","#FFFFFF"],["Evening","evening","#FFFFFF"],["Night","night","#FFFFFF"],["Leave","leave","#FCD34D"],["OT","ot","#FFD700"]];
  // ── General Staff (G) in print ─────────────────────────────────────────
  var printDs1=mkDs(y4,m4,1);
  var genEmps=[];
  for(var kg2 in emps){
    var ge_e=emps[kg2];
    // Include permanently G AND temporarily transferred TO G this month
    var ge_grp=getEmpGroupAtDate(ge_e,printDs1);
    if(ge_grp==="G")genEmps.push(ge_e);
  }
  genEmps.sort(function(a,b){return a.order-b.order;});
  if(genEmps.length>0){
    html+="<tr><td colspan='"+(2+dim4)+"' style='"+td+"background:#475569;color:white;text-align:left;padding-left:5px;font-size:7pt'>General Staff — G ("+genEmps.length+" members) · Sun–Thu Morning · Fri–Sat Off</td></tr>";
    for(var gei=0;gei<genEmps.length;gei++){
      var ge5=genEmps[gei]; var grc5=getR(getEmpRoleAtMonth(ge5,y4,m4));
      html+="<tr><td style='"+td+"text-align:left;padding-left:2px;font-size:5.5pt;background:#E2E8F0;font-weight:bold;color:#1E293B'>"+ge5.name+"</td>";
      html+="<td style='"+td+"font-size:5pt;background:#CBD5E1;font-weight:bold;text-align:center;color:#0F172A'>"+getRTitle(grc5.sh)+"</td>";
      for(var gd5=1;gd5<=dim4;gd5++){

        var gEff5=getEmpEffectiveShift(ge5,gds5,doy(new Date(y4,m4,gd5)));
        var glt5=lmapGet(lmap5,ge5.id,gds5);

        else if(gEff5==="off"){gbg5="#F1F5F9";gtx5="#94A3B8";gcell5="OFF";}
        html+="<td style='"+td+"background:"+gbg5+";color:"+gtx5+";text-align:center;font-size:5pt;font-weight:700'>"+gcell5+"</td>";
      }
      html+="</tr>";
    }
  }

  html+="<tr><td colspan='"+(2+dim4)+"' style='"+td+"background:#1E3A8A;color:white;text-align:left;padding-left:5px;font-size:7pt'>Daily Headcount per Shift</td></tr>";
  html+="<tr><td style='"+td+"background:#374151;color:white;text-align:left;padding-left:5px'>Shift</td><td style='"+td+"background:#374151'></td>";
  for(var d11=1;d11<=dim4;d11++){var dw4=dowN(y4,m4,d11);html+="<td style='"+td+"background:"+(dw4===5||dw4===6?"#7F1D1D":"#374151")+";color:white'>"+d11+"</td>";}
  html+="</tr>";

  // Per-day critical gap notes: dayNum -> ["Morning: missing SCE", ...]
  // and separately, needs-manual-pick notes (candidates exist, just need an
  // admin tap — NOT a true unsolvable shortage).
  var criticalNotes={};
  var needsManualNotes={};
  var noCoverNotes={};
  for(var dgi=1;dgi<=dim4;dgi++){
    var dgds=mkDs(y4,m4,dgi);
    var dgData=cov4[dgds];
    if(!dgData||!dgData.issues)continue;
    for(var dgii=0;dgii<dgData.issues.length;dgii++){
      var dgIss=dgData.issues[dgii];
      var dgShLb=(SC[dgIss.shift]||SC.morning).lb;
      var dgRoleLb=getRTitle(getR(dgIss.role).sh);
      var dgWho=dgIss.leaveEmp?" ("+dgIss.leaveEmp.name+")":"";
      if(dgIss.type==="critical"){
        if(!criticalNotes[dgi])criticalNotes[dgi]=[];
        criticalNotes[dgi].push(dgShLb+": missing "+dgRoleLb+dgWho);
      } else if(dgIss.type==="needsManual"){
        var dgCandNames=(dgIss.cands||[]).slice(0,3).map(function(c){return c.emp.name;}).join(", ");
        if(!needsManualNotes[dgi])needsManualNotes[dgi]=[];
        needsManualNotes[dgi].push(dgShLb+": "+dgRoleLb+dgWho+" — pick from: "+dgCandNames);
      } else if(dgIss.type==="noCover"){
        if(!noCoverNotes[dgi])noCoverNotes[dgi]=[];
        noCoverNotes[dgi].push(dgShLb+": "+dgRoleLb+dgWho);
      }
    }
  }

  for(var ci5=0;ci5<countLabels.length;ci5++){
    var cl2=countLabels[ci5];
    html+="<tr><td style='"+td+"background:"+cl2[2]+";text-align:left;padding-left:5px;font-size:7pt;font-weight:bold'>"+cl2[0]+"</td><td style='"+td+"background:"+cl2[2]+"'></td>";
    for(var d12=1;d12<=dim4;d12++){
      var ds8=mkDs(y4,m4,d12);
      var cnt2=0, isShiftRow=(cl2[1]==="morning"||cl2[1]==="evening"||cl2[1]==="night");
      if(isShiftRow){
        var dv8=doy(new Date(y4,m4,d12));
        for(var k11 in emps){
          var e7=emps[k11];
          if(e7.group==="G")continue; // General not counted in rotation shifts
          var eff4=getEmpEffectiveShift(e7,ds8,dv8);
          if(eff4!==cl2[1])continue;
          var lt6=lmapGet(lmap5,e7.id,ds8);
          if(lt6&&lt6!=="overtime")continue;
          cnt2++;
        }
        // Add successful covers for this shift
        var dayData2=cov4[ds8];
        if(dayData2&&dayData2.issues){
          for(var dii2=0;dii2<dayData2.issues.length;dii2++){
            var dIss2=dayData2.issues[dii2];
            if(dIss2.type==="cover"&&dIss2.shift===cl2[1]&&dIss2.emp)cnt2++;
          }
        }
      } else {
        for(var k10 in emps){
          var e6=emps[k10], dv7=doy(new Date(y4,m4,d12));
          var lt5=lmapGet(lmap5,e6.id,ds8);
          var eff3=getEmpEffectiveShift(e6,ds8,dv7);
          var isOTCover=otCoverMap[e6.id]&&otCoverMap[e6.id][ds8];
          if(cl2[1]==="leave"&&lt5&&lt5!=="overtime"&&eff3!=="off")cnt2++;
          else if(cl2[1]==="ot"&&isOTCover)cnt2++;
        }
      }
      var hasCriticalToday = isShiftRow && criticalNotes[d12] && criticalNotes[d12].some(function(n){return n.indexOf((SC[cl2[1]]||{}).lb)===0;});
      var isShort = isShiftRow && cnt2 < 4;
      var isExtra = isShiftRow && cnt2 > 4;
      var ccBg=cnt2===0?"#F9FAFB":cl2[2];
      var warnBg = isShort ? "#FECDD3" : isExtra ? "#BFDBFE" : ccBg;
      var cellTx = isShort ? "#7F1D1D" : isExtra ? "#1E40AF" : "#000";
      var cellFw = (isShort || isExtra) ? "font-weight:bold;" : "";
      html+="<td style='"+td+"background:"+warnBg+";color:"+cellTx+";"+cellFw+"'>"+cnt2+(isShort?" !":isExtra?" +":"")+"</td>";
    }
    html+="</tr>";
  }

  // General (G) headcount row — separate from rotation shifts
  var genEmpsAll=[];for(var kgg in emps)if(emps[kgg].group==="G")genEmpsAll.push(emps[kgg]);
  if(genEmpsAll.length>0){
    html+="<tr><td style='"+td+"background:#475569;color:white;text-align:left;padding-left:5px;font-size:7pt;font-weight:bold'>General (G)</td><td style='"+td+"background:#475569'></td>";
    for(var dg2=1;dg2<=dim4;dg2++){
      var dsG=mkDs(y4,m4,dg2);
      var dvG=doy(new Date(y4,m4,dg2));
      var cntG=0;
      genEmpsAll.forEach(function(ge){
        var effG=getEmpEffectiveShift(ge,dsG,dvG);
        var ltG=lmapGet(lmap5,ge.id,dsG);
        if(effG!=="off"&&(!ltG||ltG==="overtime"))cntG++;
      });
      var dw5=dowN(y4,m4,dg2);
      var isWeekend=(dw5===5||dw5===6);
      html+="<td style='"+td+"background:"+(isWeekend?"#F1F5F9":"#E2E8F0")+";color:"+(isWeekend?"#94A3B8":"#1E293B")+";font-weight:bold'>"+cntG+"</td>";
    }
    html+="</tr>";
  }

  html+="</tbody></table></div>";

  // ── Standalone Alerts Table ─────────────────────────────────
  // All three alert types (Critical Gap, Needs Manual Pick, Needs Staffing)
  // are collected into ONE separate table printed BELOW the main schedule.
  // Each row has: Date | Day | Shift | Role/Slot | Type | Reason
  // This replaces the old inline rows inside the main table.
  var DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var alertRows = [];
  for(var ali=1;ali<=dim4;ali++){
    var alds = mkDs(y4,m4,ali);
    var alData = cov4[alds];
    if(!alData||!alData.issues) continue;
    var alDayName = DAY_NAMES[new Date(y4,m4,ali).getDay()];
    var alDateStr = ali+"/"+String(m4+1).replace(/^(\d)$/,"0$1")+"/"+y4;
    for(var alii=0;alii<alData.issues.length;alii++){
      var alIss = alData.issues[alii];
      var alShift = (SC[alIss.shift]||SC.morning).lb;
      var alRole = getRTitle(getR(alIss.role).sh);
      var alType, alTypeBg, alTypeTx, alReason;
      if(alIss.type==="critical"){
        alType="Critical Gap";
        alTypeBg="#7F1D1D"; alTypeTx="#FCA5A5";
        alReason="No cover found for "+alRole+" slot"+(alIss.leaveEmp?" — On leave: "+alIss.leaveEmp.name:"");
      } else if(alIss.type==="needsManual"){
        alType="Needs Manual Pick";
        alTypeBg="#78350F"; alTypeTx="#FCD34D";
        var candNames=(alIss.cands||[]).slice(0,3).map(function(c){return c.emp.name;}).join(", ");
        alReason="Candidates available but hit OT cap/rest limit"+(alIss.leaveEmp?" — Replacing: "+alIss.leaveEmp.name:"")+(candNames?" — Options: "+candNames:"");
      } else if(alIss.type==="noCover"){
        alType="Needs Staffing";
        alTypeBg="#450A0A"; alTypeTx="#FCA5A5";
        alReason="Admin chose to leave slot uncovered"+(alIss.leaveEmp?" — On leave: "+alIss.leaveEmp.name:"");
      } else {
        continue; // ok/cover/internal — no alert needed
      }
      alertRows.push({date:alDateStr, day:alDayName, shift:alShift, role:alRole, type:alType, typeBg:alTypeBg, typeTx:alTypeTx, reason:alReason});
    }
  }

  if(alertRows.length > 0){
    var atd="border:1px solid #aaa;padding:4px 6px;font-size:7pt;";
    html+="<div style='margin-top:18px;page-break-inside:avoid'>";
    html+="<div style='background:#1E293B;color:white;padding:5px 8px;font-size:8pt;font-weight:bold;border-radius:4px 4px 0 0'>Shift Alerts — "+alertRows.length+" item"+(alertRows.length!==1?"s":"")+"</div>";
    html+="<table style='width:100%;border-collapse:collapse;background:white'>";
    html+="<thead><tr style='background:#F1F5F9'>";
    html+="<th style='"+atd+"font-weight:bold;text-align:center;width:60px'>Date</th>";
    html+="<th style='"+atd+"font-weight:bold;text-align:center;width:35px'>Day</th>";
    html+="<th style='"+atd+"font-weight:bold;text-align:center;width:60px'>Shift</th>";
    html+="<th style='"+atd+"font-weight:bold;text-align:center;width:50px'>Role</th>";
    html+="<th style='"+atd+"font-weight:bold;text-align:center;width:110px'>Alert Type</th>";
    html+="<th style='"+atd+"font-weight:bold;text-align:left'>Reason</th>";
    html+="</tr></thead><tbody>";
    for(var ari=0;ari<alertRows.length;ari++){
      var ar=alertRows[ari];
      var rowBg=ari%2===0?"#FFFFFF":"#F8FAFC";
      html+="<tr style='background:"+rowBg+"'>";
      html+="<td style='"+atd+"text-align:center;font-weight:bold'>"+ar.date+"</td>";
      html+="<td style='"+atd+"text-align:center;color:#64748B'>"+ar.day+"</td>";
      html+="<td style='"+atd+"text-align:center'>"+ar.shift+"</td>";
      html+="<td style='"+atd+"text-align:center;font-weight:bold'>"+ar.role+"</td>";
      html+="<td style='"+atd+"text-align:center;background:"+ar.typeBg+";color:"+ar.typeTx+";font-weight:bold'>"+ar.type+"</td>";
      html+="<td style='"+atd+"text-align:left;color:#374151'>"+ar.reason+"</td>";
      html+="</tr>";
    }
    html+="</tbody></table></div>";
  }

  html+="</div></body></html>";
  var w2=window.open("","_blank","width=1200,height=800");
  if(w2){w2.document.write(html);w2.document.close();}else showNotif("⚠️ Allow popups",true);
}

// ── Month Plan Modal ──────────────────────────────────────
function openPlanMonth(empId, planYear, monthIdx) {
  var old = document.getElementById("plan-ov"); if (old) old.remove();
  var emp = STATE.emps[empId]; if (!emp) return;
  var MAR_SH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MAR_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  var o = mkEl("div","position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;direction:rtl;");
  o.id = "plan-ov";
  var box = mkEl("div","background:#1E293B;border-radius:14px;padding:20px;width:90%;max-width:420px;border:1px solid #334155;max-height:88vh;overflow-y:auto;");

  ap(box,
    mkEl("div","font-size:11px;color:#64748B;margin-bottom:2px;","Leave plan for:"),
    mkEl("div","font-size:14px;font-weight:800;color:#F8FAFC;margin-bottom:2px;",emp.name),
    mkEl("div","font-size:12px;color:#A78BFA;font-weight:600;margin-bottom:14px;",MAR_FULL[monthIdx]+" "+planYear)
  );

  // Existing entries for this month
  if (!STATE.annualPlan) STATE.annualPlan = {};
  if (!STATE.annualPlan[planYear]) STATE.annualPlan[planYear] = {};
  if (!STATE.annualPlan[planYear][empId]) STATE.annualPlan[planYear][empId] = [];
  var entries = STATE.annualPlan[planYear][empId].filter(function(e){return e.month===monthIdx;});

  var existDiv = document.createElement("div");
  existDiv.style.marginBottom = "13px";

  function refreshExisting() {
    existDiv.innerHTML = "";
    var ents = STATE.annualPlan[planYear][empId].filter(function(e){return e.month===monthIdx;});
    if (ents.length === 0) {
      existDiv.appendChild(mkEl("div","font-size:11px;color:#475569;padding:7px 0;","No planned leaves for this month yet"));
      return;
    }
    existDiv.appendChild(mkEl("div","font-size:11px;font-weight:700;color:#94A3B8;margin-bottom:6px;","Planned entries:"));
    ents.forEach(function(entry) {
      var row2 = mkRow("background:#111827;border-radius:7px;padding:7px 10px;margin-bottom:5px;gap:8px;");
      var info = document.createElement("div"); info.style.flex = "1";
      ap(info,
        mkEl("div","font-size:11px;color:#E2E8F0;font-weight:600;",fmtD(entry.from)+" → "+fmtD(entry.to)+" ("+entry.days+" days)"),
        entry.note ? mkEl("div","font-size:10px;color:#64748B;font-style:italic;",'"'+entry.note+'"') : mkEl("div","","")
      );
      var stBg = entry.status==="approved"?"#064E3B":entry.status==="rejected"?"#7F1D1D":"#1E293B";
      var stCl = entry.status==="approved"?"#34D399":entry.status==="rejected"?"#F87171":"#F59E0B";
      var stLb = entry.status==="approved"?"✅ Approved":entry.status==="rejected"?"❌ Rejected":"⏳ Pending";
      var stBadge = mkEl("span","font-size:9px;background:"+stBg+";color:"+stCl+";border-radius:4px;padding:2px 6px;white-space:nowrap;align-self:center;",stLb);
      var delBtn = document.createElement("button");
      delBtn.style.cssText = "background:#7F1D1D22;border:1px solid #EF4444;color:#F87171;border-radius:5px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:inherit;";
      delBtn.textContent = "🗑️";
      delBtn.onclick = function(eid2) {
        return function() {
          requireAdmin(function(){
            STATE.annualPlan[planYear][eid2] = STATE.annualPlan[planYear][eid2].filter(function(e){return e!==entry;});
            sLS("sc6_annualplan", STATE.annualPlan);
            showNotif("Deleted"); refreshExisting(); render();
          });
        };
      }(empId);
      // Approve/reject (admin only)
      if (can("canApproveLeave") && STATE.isAdmin && entry.status==="pending") {
        var apBtn = document.createElement("button");
        apBtn.style.cssText = "background:#064E3B;border:1px solid #10B981;color:#34D399;border-radius:5px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:inherit;";
        apBtn.textContent = "✅";
        apBtn.onclick = function(e2){return function(){requireAdmin(function(){e2.status="approved";sLS("sc6_annualplan",STATE.annualPlan);refreshExisting();render();});};}(entry);
        row2.appendChild(info); row2.appendChild(stBadge); row2.appendChild(apBtn); row2.appendChild(delBtn);
      } else {
        row2.appendChild(info); row2.appendChild(stBadge); row2.appendChild(delBtn);
      }
      existDiv.appendChild(row2);
    });
  }
  refreshExisting();
  box.appendChild(existDiv);

  // Add new entry form
  var addHdr = mkEl("div","font-size:11px;font-weight:700;color:#94A3B8;margin-bottom:8px;","+ Add planned leave:");
  box.appendChild(addHdr);
  var formDiv = mkEl("div","background:#111827;border-radius:9px;padding:12px;margin-bottom:12px;");
  var fInp = mkInp("","","date"); var tInp2 = mkInp("","","date");
  var noteInp = mkInp("","Optional note — e.g. Hajj, vacation...");

  // Set default dates within this month
  var firstDay = mkDs(planYear, monthIdx, 1);
  var lastDay = mkDs(planYear, monthIdx, daysInM(planYear, monthIdx));
  fInp.value = firstDay; fInp.min = firstDay; fInp.max = lastDay;
  tInp2.value = firstDay; tInp2.min = firstDay; tInp2.max = lastDay;

  var daysPreview = mkEl("div","font-size:11px;color:#60A5FA;margin-top:5px;font-weight:700;","");
  function updPreview(){
    if(fInp.value&&tInp2.value&&tInp2.value>=fInp.value){
      var d2=rangeD(fInp.value,tInp2.value).length;
      // Count only working days
      var workD=0;
      for(var pd=0;pd<rangeD(fInp.value,tInp2.value).length;pd++){
        var pds=rangeD(fInp.value,tInp2.value)[pd];
        var pdv=doy(new Date(pds));
        if(getEmpEffectiveShift(emp,pds,pdv)!=="off")workD++;
      }
      daysPreview.textContent="📅 "+d2+" calendar days · "+workD+" working days";
    } else daysPreview.textContent="";
  }
  fInp.onchange=updPreview; tInp2.onchange=updPreview; updPreview();

  var fg2 = mkEl("div","display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;");
  fg2.appendChild(mkLbl("From", fInp)); fg2.appendChild(mkLbl("To", tInp2));
  formDiv.appendChild(fg2);
  formDiv.appendChild(mkLbl("Note", noteInp));
  formDiv.appendChild(daysPreview);
  box.appendChild(formDiv);

  var btnRow4 = mkRow("gap:8px;");
  var addEntryBtn = mkBtn("➕ Add to Plan","#3B82F6",function(){
    if(!fInp.value||!tInp2.value){showNotif("Select dates",true);return;}
    if(tInp2.value<fInp.value){showNotif("End must be after start",true);return;}
    var dts3=rangeD(fInp.value,tInp2.value);
    var workDays3=0;
    for(var wd3=0;wd3<dts3.length;wd3++){var ds3=dts3[wd3];if(getEmpEffectiveShift(emp,ds3,doy(new Date(ds3)))!=="off")workDays3++;}

    +"</div>";
  html+="<h1 style='font-size:16pt;font-weight:bold;margin-bottom:4px;'>Request C-OFF</h1>";
  html+="<h2 style='font-size:12pt;font-weight:600;margin-bottom:2px;color:#1E3A8A;'>"+h.name+"</h2>";
  html+="<p style='font-size:9pt;color:#64748B;margin-bottom:14px;'>"+h.from+" — "+h.to+" ("+days.length+" day"+(days.length!==1?"s":"")+")</p>";
  html+="<table style='width:100%;border-collapse:collapse;'>";
  html+="<thead><tr style='background:#1E3A8A;color:white;'>";
  ["#","Employee","Role","Group","C-OFF Days","Signature"].forEach(function(c){
    html+="<th style='"+td+"color:white;text-align:center;font-weight:bold;padding:7px 10px;'>"+c+"</th>";
  });
  html+="</tr></thead><tbody>";
  empRows.forEach(function(row,i){
    var bg=i%2===0?"#FFFFFF":"#F8FAFC";
    var rc=getR(row.emp.role);
    html+="<tr style='background:"+bg+"'>";
    html+="<td style='"+td+"text-align:center;color:#94A3B8;'>"+(i+1)+"</td>";
    html+="<td style='"+td+"font-weight:bold;color:#1E293B;'>"+row.emp.name+"</td>";
    html+="<td style='"+td+"text-align:center;background:"+rc.cl+"22;color:"+rc.cl+";font-weight:bold;'>"+getRTitle(rc.sh)+"</td>";
    html+="<td style='"+td+"text-align:center;'>"+row.emp.group+"</td>";
    html+="<td style='"+td+"text-align:center;font-size:13pt;font-weight:800;color:#065F46;background:#DCFCE7;'>"+row.compDays+"</td>";
    html+="<td style='"+td+"min-width:120px;'></td>";
    html+="</tr>";
  });
  html+="</tbody></table>";
  html+="</body></html>";
  var w=window.open("","_blank","width=750,height=900");
  if(w){w.document.write(html);w.document.close();}else showNotif("⚠️ Allow popups",true);
}

// Returns the employee's role as it was during a specific month.
// roleHistory[empId] = [{role:"CRE", until:"2026-08-01"}]
// means: employee had role "CRE" for all months BEFORE August 2026.
// From August 2026 onwards, they use emp.role (the current role).
function applyTheme(theme) {
  STATE.theme = theme;
  var body = document.body;
  var app = document.getElementById ? document.getElementById("app") : null;
  if (body && body.classList) {
    if (theme === "light") {
      body.classList.add("light-mode");
      if (body.style) { body.style.background = "#F0F4F8"; body.style.color = "#0F172A"; }
      if (app && app.style) { app.style.background = "#F0F4F8"; app.style.color = "#0F172A"; }
    } else {
      body.classList.remove("light-mode");
      if (body.style) { body.style.background = "#0F172A"; body.style.color = "#F1F5F9"; }
      if (app && app.style) { app.style.background = "#0F172A"; app.style.color = "#F1F5F9"; }
    }
  }
}

// Theme-aware color helper — call TC("dark-val","light-val") throughout render
function TC(dark, light) {
  return STATE.theme === "light" ? light : dark;
}
// Shorthand theme colors used in render
function TH() {
  var L = STATE.theme === "light";
  return {
    bgMain:  L?"#F0F4F8":"#0F172A",
    bgCard:  L?"#FFFFFF":"#1E293B",
    bgHdr:   L?"#E2E8F0":"#111827",
    bgInput: L?"#FFFFFF":"#0F172A",
    bgRow:   L?"#F8FAFC":"#1E293B",
    bgRow2:  L?"#FFFFFF":"#1E293B",
    bgHover: L?"#E2E8F0":"#334155",
    txtMain: L?"#0F172A":"#F8FAFC",
    txtSub:  L?"#475569":"#94A3B8",
    txtMuted:L?"#64748B":"#64748B",
    border:  L?"#CBD5E1":"#334155",
    border2: L?"#E2E8F0":"#1E293B"
  };
}

// Get how many leave days an employee has used this year vs their balance
function getLeaveUsed(empId, lt, year) {
  var used = 0;
  STATE.lreqs.forEach(function(r) {
    if (r.empId !== empId || r.lt !== lt || r.status !== "approved") return;
    rangeD(r.from, r.to).forEach(function(ds) {
      if (ds.indexOf(year+"-") === 0) used++;
    });
  });
  return used;
}

function getEmpGroupAtDate(emp, ds) {
  var tr = STATE.transferLog && STATE.transferLog[emp.id];
  if (tr && tr.startDate) {
    if (ds < tr.startDate) return tr.oldGi >= 0 ? GR[tr.oldGi] : emp.group;
    if (tr.endDate && ds > tr.endDate) return tr.oldGi >= 0 ? GR[tr.oldGi] : emp.group;
    return tr.newGi >= 0 ? GR[tr.newGi] : "G"; // gi=-1 = General
  }
  return emp.group;
}

function getEmpAlQuota(empId) {
  var AL_DEFAULT = (STATE.rules && STATE.rules.annualLeaveQuota) || 30;
  return (STATE.leaveBalance && STATE.leaveBalance[empId] && STATE.leaveBalance[empId].annual)
    || AL_DEFAULT;
}

function getLeaveBalance(empId, lt) {
  var defaults = {annual:30, sick:15, emergency:5, paternal:10};
  var cfg = STATE.leaveBalance && STATE.leaveBalance[empId];
  if (cfg && cfg[lt] !== undefined) return cfg[lt];
  return defaults[lt] || 0;
}

function getEmpRoleAtMonth(emp, y, m) {
  var hist = STATE.roleHistory && STATE.roleHistory[emp.id];
  if (!hist || hist.length === 0) return emp.role;
  var monthStart = mkDs(y, m, 1);
  // Sort by 'until' descending (most recent change first)
  var sorted = hist.slice().sort(function(a,b){return b.until>a.until?1:-1;});
  for (var i = 0; i < sorted.length; i++) {
    if (monthStart < sorted[i].until) {
      // This month is BEFORE the change date → use the historical role
      return sorted[i].role;
    }
  }
  // Month is at or after all changes → use current role
  return emp.role;
}

  STATE.admins = lLS("sc6_admins", DEF_ADMINS);
  if (!STATE.admins || !STATE.admins.some(function(a){return a.role==="superadmin";})) { STATE.admins = DEF_ADMINS; sLS("sc6_admins", STATE.admins); }
  STATE.emps = lLS("sc6_emps", buildEmps());
  STATE.lreqs = lLS("sc6_lreqs", []);
  STATE.rules = lLS("sc6_rules", DEF_RULES);
  STATE.linkedEmployees = lLS("sc6_linkedemployees", {});
  STATE.otAssign = lLS("sc6_otassign", {});
  STATE.slotAssign = lLS("sc6_slotassign", {});
  STATE.lockedMonths = lLS("sc6_lockedmonths", {});
  STATE.roleHistory = lLS("sc6_rolehistory", {});
  STATE.roleTitles = lLS("sc6_roletitles", {});
  STATE.shiftOverride = lLS("sc6_shiftoverride", {});
  STATE.transferLog = lLS("sc6_transferlog", {});
  STATE.extraRanges = lLS("sc6_extraranges", {});
  STATE.annualPlan = lLS("sc6_annualplan", {});
  STATE.customGroups = lLS("sc6_customgroups", {});
  STATE.holidays = lLS("sc6_holidays", []);

  render();
}
