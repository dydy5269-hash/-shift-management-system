// SHIFT SCHEDULE SYSTEM
// Pure ES5 — no arrow functions, no template literals,
// no let/const, no Array.from, no spread
// =============================================

// ── Constants ────────────────────────────────

  morning: {bg:"#E0F2FE",tx:"#0369A1",lb:"Morning",ic:"☀️",code:"M"},
  evening: {bg:"#ECFDF5",tx:"#065F46",lb:"Evening",ic:"🌆",code:"E"},

};
var LC = {
  annual:   {bg:"#FEF9C3",tx:"#713F12",lb:"Annual Leave",    code:"AL",pbg:"#FEF08A"},
  sick:     {bg:"#FEE2E2",tx:"#991B1B",lb:"Sick Leave",      code:"SL",pbg:"#FECACA"},
  emergency:{bg:"#FFF1F2",tx:"#9F1239",lb:"Emergency Leave", code:"EL",pbg:"#FECDD3"},
  paternal: {bg:"#FDF4FF",tx:"#7E22CE",lb:"Paternal Leave",  code:"PL",pbg:"#F5D0FE"},
  coff:     {bg:"#EFF6FF",tx:"#1D4ED8",lb:"C-OFF",           code:"C-OFF",pbg:"#BFDBFE"},
  training: {bg:"#F0FDF4",tx:"#15803D",lb:"Training",        code:"TL",pbg:"#BBF7D0"},
  unpaid:   {bg:"#F8FAFC",tx:"#374151",lb:"Unpaid Leave",    code:"UL",pbg:"#E5E7EB"}
};
var OT = {bg:"#FFFBEB",tx:"#92400E",lb:"Overtime",code:"OT",pbg:"#FDE68A"};

var ROLES = {
  SCE: {lb:"Shift Control Engineer",      sh:"SCE", cl:"#DC2626"},
  ASCE:{lb:"Asst. Shift Control Engineer",sh:"ASCE",cl:"#EA580C"},
  CRE: {lb:"Control Room Engineer",       sh:"CRE", cl:"#7C3AED"},
  ACRE:{lb:"Asst. Control Room Engineer", sh:"ACRE",cl:"#0284C7"},
  FE:  {lb:"Field Engineer",              sh:"FE",  cl:"#059669"}
};
var RK = ["SCE","ASCE","CRE","ACRE","FE"];

// Coverage compatibility
function compatRoles(role) {
  if (role === "SCE")  return ["SCE","ASCE"];
  if (role === "CRE")  return ["CRE","ASCE","ACRE"];
  if (role === "FE")   return ["FE","ACRE"];
  return [role];
}

// 4 slots per shift
var SLOTS = [
  {id:"SCE",role:"SCE"},
  {id:"CRE",role:"CRE"},
  {id:"FE1",role:"FE"},
  {id:"FE2",role:"FE"}
];

// Rotation: 5 groups, 10-day cycle, exactly 1 group per shift
var ROT = [
  ["morning","morning","evening","evening","night","night","off","off","off","off"],
  ["off","off","morning","morning","evening","evening","night","night","off","off"],
  ["off","off","off","off","morning","morning","evening","evening","night","night"],
  ["night","night","off","off","off","off","morning","morning","evening","evening"],
  ["evening","evening","night","night","off","off","off","off","morning","morning"]
];

var GR = ["A","B","C","D","E"];
var GRC = {A:"#60A5FA",B:"#34D399",C:"#F59E0B",D:"#F472B6",E:"#A78BFA"};
var MAR = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var DAR = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DSH = ["Su","Mo","Tu","We","Th","Fr","Sa"];

var DEF_ADMINS = [{id:"sa1",username:"admin",password:"-969161597",role:"superadmin",name:"System Admin"}];

// Permission levels:
// superadmin: everything
// admin:      everything EXCEPT managing admin users (Admins tab)
// viewer:     read-only — can see Coverage and Stats only, no edits

// What each role CAN do
var ROLE_PERMS = {
  superadmin: {
    canEdit: true, canApproveLeave: true, canManageStaff: true,
    canManageAdmins: true, canExport: true, canManageRules: true,
    canAssignOT: true, canTransfer: true
  },
  admin: {
    canEdit: true, canApproveLeave: true, canManageStaff: true,
    canManageAdmins: false, canExport: true, canManageRules: true,
    canAssignOT: true, canTransfer: true
  },
  viewer: {
    canEdit: false, canApproveLeave: false, canManageStaff: false,
    canManageAdmins: false, canExport: true, canManageRules: false,
    canAssignOT: false, canTransfer: false
  }
};

function getMyRole() {
  if (!STATE.isAdmin || !STATE.currentUser) return "viewer";
  return STATE.currentUser.role || "viewer";
}

function can(perm) {
  var role = getMyRole();
  var perms = ROLE_PERMS[role] || ROLE_PERMS.viewer;
  return perms[perm] === true;
}

function requirePerm(perm, cb) {
  if (!STATE.isAdmin) { requireAdmin(function(){ if(can(perm)) cb(); else showNotif("⛔ No permission for this action",true); }); return; }
  if (can(perm)) { cb(); return; }
  showNotif("⛔ Your role ("+getMyRole()+") cannot perform this action",true);
}
var DEF_RULES = {SCE:1,CRE:1,FE:1,ASCE:1,ACRE:1};

var INIT_EMPS = {
  A:[{name:"Said Alshahri",role:"SCE"},{name:"Khalid AlRawas",role:"CRE"},{name:"Bakhit Al-Mashani",role:"FE"},{name:"Nasser Almamari",role:"FE"}],
  B:[{name:"Mundhar",role:"SCE"},{name:"Alawi Al Ibrahim",role:"CRE"},{name:"Abdul Rahim",role:"FE"},{name:"Salim Al Amri",role:"FE"},{name:"Suhail Zaabnut",role:"FE"}],
  C:[{name:"Harry",role:"SCE"},{name:"Subramanian",role:"CRE"},{name:"Ali Al-Mashani",role:"FE"},{name:"Hassan Tabook",role:"FE"},{name:"Ghali Baitsaid",role:"FE"}],
  D:[{name:"Ahmed Al-shahri",role:"SCE"},{name:"Madhu",role:"CRE"},{name:"Mohammed",role:"FE"},{name:"Khalid Al Hadhri",role:"FE"}],
  E:[{name:"Aiman ALYafai",role:"SCE"},{name:"Mulham Al amri",role:"CRE"},{name:"Omran BaOmar",role:"FE"},{name:"Nasser Al Jafary",role:"FE"},{name:"Abdullah Al Ibrahim",role:"FE"}]
};

// ── Helpers ────────────────────────────────────
function hpw(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h = h | 0;
  }
  return String(h);
}
function sLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function lLS(k, fb) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function doy(date) { return Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000) - 1; }
function shiftFor(gi, d) { return ROT[gi % 5][((d % 10) + 10) % 10]; }
function mkDs(y, m, d) {
  var mm = m + 1 < 10 ? "0" + (m + 1) : "" + (m + 1);
  var dd = d < 10 ? "0" + d : "" + d;
  return y + "-" + mm + "-" + dd;
}
function fmtD(s) {
  if (!s) return "";
  var p = s.split("-");
  return p[2] + "/" + p[1] + "/" + p[0];
}
function rangeD(from, to) {
  var a = [], c = new Date(from), e = new Date(to);
  while (c <= e) {
    a.push(c.toISOString().split("T")[0]);
    c.setDate(c.getDate() + 1);
  }
  return a;
}
function dowN(y, m, d) { return new Date(y, m, d).getDay(); }
function daysInM(y, m) { return new Date(y, m + 1, 0).getDate(); }
function genId() { return "e" + Date.now().toString(36) + Math.random().toString(36).substr(2, 4); }
function lmapGet(lm, id, ds) { return lm[id] ? lm[id][ds] : null; }
function getR(role) { return ROLES[role] || ROLES.FE; }
function getRTitle(role) { return (STATE.roleTitles && STATE.roleTitles[role]) || role; }
function grpCount(emps, g) { var c = 0; for (var k in emps) if (emps[k].group === g) c++; return c; }

function buildEmps() {
  var e = {};
  for (var gi = 0; gi < GR.length; gi++) {
    var g = GR[gi], ns = INIT_EMPS[g] || [];
    for (var ni = 0; ni < ns.length; ni++) {
      var id = g + "-" + ni;
      e[id] = {id:id, group:g, role:ns[ni].role, name:ns[ni].name, gi:gi, order:ni};
    }
  }
  return e;
}

function getEmpEffectiveShift(emp, ds, dv) {
  var ovr = STATE.shiftOverride && STATE.shiftOverride[emp.id] && STATE.shiftOverride[emp.id][ds];
  if (ovr) return ovr;
  var tr = STATE.transferLog && STATE.transferLog[emp.id];
  if (tr && tr.startDate) {
    if (ds >= tr.startDate) {
      // After transfer date → use new group rotation
      return shiftFor(tr.newGi, dv);
    } else {
      // Before transfer date → use OLD group rotation (stored in transferLog)
      return shiftFor(tr.oldGi, dv);
    }
  }
  return shiftFor(emp.gi, dv);
}

function countWorkDays(emp, lmap, y, m) {
  var dim = daysInM(y, m), cnt = 0;
  for (var d = 1; d <= dim; d++) {
    var ds = mkDs(y, m, d), dv = doy(new Date(y, m, d));
    if (getEmpEffectiveShift(emp, ds, dv) === "off") continue;
    if (lmapGet(lmap, emp.id, ds)) continue;
    cnt++;
  }
  return cnt;
}

function buildLmap(lreqs) {
  var lmap = {};
  for (var i = 0; i < lreqs.length; i++) {
    var r = lreqs[i];
    if (r.status !== "approved" || r.lt === "overtime") continue;
    if (!lmap[r.empId]) lmap[r.empId] = {};
    var dates = rangeD(r.from, r.to);
    for (var j = 0; j < dates.length; j++) lmap[r.empId][dates[j]] = r.lt || "annual";
  }
  return lmap;
}

// ── STATE ─────────────────────────────────────
var STATE = {
  isAdmin: false, currentUser: null, tab: "cov",
  annualPlan: null,  // {year: {empId: [{month,from,to,days,note,status}]}}
  year: new Date().getFullYear(), month: new Date().getMonth(),
  selDay: null,
  admins: null, emps: null, lreqs: null, rules: null, roleTitles: null,
  notifTimer: null, addGrp: null, editEmpId: null,
  leaveForm: {empId:"",from:"",to:"",lt:"annual",reason:""},
  filterEmp: "", filterSt: "all", showLeaveForm: false,
  adminForm: {name:"",username:"",password:"",role:"admin"},
  showAdminForm: false, editAdminId: null,
  pinCb: null,
  otAssign: {}, transferMode: false, transferEmpId: null,
  covData: null, shiftOverride: {}, transferLog: {}
};

// ── Coverage Engine ───────────────────────────
function computeCov(emps, lreqs, y, m) {
  var dim = daysInM(y, m), all = [], lmap = buildLmap(lreqs), cov = {};
  for (var k in emps) all.push(emps[k]);
  var wdMap = {};
  for (var wi = 0; wi < all.length; wi++) wdMap[all[wi].id] = countWorkDays(all[wi], lmap, y, m);
  var gSz = {};
  for (var gi = 0; gi < GR.length; gi++) gSz[GR[gi]] = 0;
  for (var k2 in emps) if (gSz[emps[k2].group] !== undefined) gSz[emps[k2].group]++;

  for (var d = 1; d <= dim; d++) {
    var ds = mkDs(y, m, d), dv = doy(new Date(y, m, d));
    var inShift = {morning:{},evening:{},night:{}};
    for (var ri = 0; ri < RK.length; ri++) {
      inShift.morning[RK[ri]] = [];
      inShift.evening[RK[ri]] = [];
      inShift.night[RK[ri]]   = [];
    }
    for (var ai = 0; ai < all.length; ai++) {
      var emp = all[ai];
      var base = getEmpEffectiveShift(emp, ds, dv);
      if (base === "off") continue;
      if (lmapGet(lmap, emp.id, ds)) continue;
      if (inShift[base] && inShift[base][emp.role]) inShift[base][emp.role].push(emp);
    }
    var slots = {morning:{},evening:{},night:{}}, issues = [];
    var sks = ["morning","evening","night"];
    for (var si = 0; si < sks.length; si++) {
      var sk = sks[si], usedCover = {}, feUsed = [];
      for (var sli = 0; sli < SLOTS.length; sli++) {
        var slot = SLOTS[sli], role = slot.role, slotId = slot.id;
        var compat = compatRoles(role);
        var pool = [];
        for (var ci = 0; ci < compat.length; ci++) {
          var arr = inShift[sk][compat[ci]] || [];
          for (var ai2 = 0; ai2 < arr.length; ai2++) {
            if (role === "FE" && feUsed.indexOf(arr[ai2].id) >= 0) continue;
            pool.push(arr[ai2]);
          }
        }
        pool.sort(function(a,b) { return (a.role===role?0:1)-(b.role===role?0:1); });
        var present = pool.length > 0 ? [pool[0]] : [];
        if (role === "FE" && present.length > 0) feUsed.push(present[0].id);
        var onLeave = [];
        for (var ai3 = 0; ai3 < all.length; ai3++) {
          var e3 = all[ai3];
          if (e3.role !== role) continue;
          if (getEmpEffectiveShift(e3, ds, dv) !== sk) continue;
          if (!lmapGet(lmap, e3.id, ds)) continue;
          onLeave.push(e3);
        }
        var covers = [], hasGap = present.length === 0 && onLeave.length > 0;
        if (hasGap) {
          var leaveEmp = onLeave[0];
          var manualId = STATE.otAssign[ds+":"+sk+":"+slotId] || null;
          var manualEmp = manualId ? emps[manualId] : null;
          var cands = [];
          for (var ci2 = 0; ci2 < all.length; ci2++) {
            var ec = all[ci2];
            if (usedCover[ec.id]) continue;
            if (compat.indexOf(ec.role) < 0) continue;
            if (getEmpEffectiveShift(ec, ds, dv) !== "off") continue;
            if (lmapGet(lmap, ec.id, ds)) continue;
            cands.push({emp:ec, wd:wdMap[ec.id]||0, crossRole:ec.role!==role});
          }
          cands.sort(function(a,b) {
            var ae=a.emp.role===role?0:1, be=b.emp.role===role?0:1;
            if (ae !== be) return ae-be;
            return a.wd-b.wd;
          });
          var found = null, foundManual = false;
          if (manualEmp && !usedCover[manualEmp.id]) { found = manualEmp; foundManual = true; }
          else if (cands.length > 0) found = cands[0].emp;
          if (found) {
            usedCover[found.id] = true;
            covers.push({emp:found, manual:foundManual, crossRole:found.role!==role, coverRole:found.role});
            issues.push({type:"cover",shift:sk,slotId:slotId,role:role,emp:found,leaveEmp:leaveEmp,manual:foundManual,cands:cands});
          } else {
            covers.push({emp:null, type:"critical", cands:cands});
            issues.push({type:"critical",shift:sk,slotId:slotId,role:role,leaveEmp:leaveEmp,cands:cands});
          }
        }
        var slotTag = "ok";
        if (covers.some(function(c){return !c.emp;})) slotTag = "critical";
        else if (covers.length > 0) slotTag = "covered";
        slots[sk][slotId] = {present:present, onLeave:onLeave, covers:covers, tag:slotTag, role:role,
          cands: hasGap&&covers.length ? (covers[0].cands||[]) : []};
      }
    }
    cov[ds] = {slots:slots, issues:issues};
  }
  return {cov:cov, lmap:lmap, wdMap:wdMap, gSz:gSz};
}

// ── PIN Auth ──────────────────────────────────
function requireAdmin(cb) {
  if (STATE.isAdmin) { cb(); return; }
  STATE.pinCb = cb;
  showPinModal();
}

  var errDiv = document.createElement("div");
  errDiv.style.cssText = "background:#7F1D1D;border:1px solid #EF4444;border-radius:7px;padding:7px;margin-bottom:10px;font-size:11px;color:#FCA5A5;text-align:center;display:none";

      errDiv.textContent = "❌ Wrong credentials"; errDiv.style.display = "block"; pI.value = ""; pI.focus();

  pI.addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
  uI.addEventListener("keydown", function(e) { if (e.key === "Enter") pI.focus(); });
  var btnRow = document.createElement("div"); btnRow.style.cssText = "display:flex;gap:8px;";
  var loginBtn = mkBtn("Login","#3B82F6",doLogin,"flex:1;border-radius:8px;padding:11px;font-size:13px;font-weight:700;");
  var cancelBtn = mkBtn("Cancel","#374151",function(){STATE.pinCb=null;o.remove();},"border-radius:8px;padding:11px 12px;font-size:12px;");
  cancelBtn.style.color = "#94A3B8";
  btnRow.appendChild(loginBtn); btnRow.appendChild(cancelBtn); box.appendChild(btnRow);
  var rlBtn = document.createElement("button");
  rlBtn.style.cssText = "display:block;margin:10px auto 0;background:none;border:none;color:#475569;font-size:10px;cursor:pointer;text-decoration:underline;font-family:inherit;";
  rlBtn.textContent = "Reset to default (admin/admin123)";
  rlBtn.onclick = function() { if (confirm("Reset accounts?")) { localStorage.removeItem("sc6_admins"); STATE.admins = DEF_ADMINS; o.remove(); showNotif("✅ Reset done"); } };
  box.appendChild(rlBtn);
  o.appendChild(box); document.body.appendChild(o);
  setTimeout(function() { uI.focus(); }, 80);

// ── DOM Helpers ───────────────────────────────
function mkEl(tag, css, txt) {
  var e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (txt !== undefined && txt !== null) e.textContent = String(txt);
  return e;
}
function mkBtn(txt, bg, onclick, extraCss) {
  var b = document.createElement("button");
  b.style.cssText = "background:" + bg + ";color:white;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;" + (extraCss||"");
  b.textContent = txt;
  b.onclick = onclick;
  return b;
}
function mkRow(css) { var d = document.createElement("div"); d.style.cssText = "display:flex;align-items:center;gap:8px;flex-wrap:wrap;" + (css||""); return d; }
function mkCard(css) { var d = document.createElement("div"); d.style.cssText = "background:#1E293B;border-radius:12px;border:1px solid #334155;overflow:hidden;" + (css||""); return d; }
function mkChip(txt, bg, tx) { var s = document.createElement("span"); s.style.cssText = "background:"+bg+";color:"+tx+";border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;"; s.textContent = txt; return s; }
function mkBadge(txt, bg, tx) { var s = document.createElement("span"); s.style.cssText = "background:"+bg+";color:"+tx+";border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap;"; s.textContent = txt; return s; }
function mkInp(val, ph, type) { var e = document.createElement("input"); e.className = "inp"; e.type = type||"text"; e.placeholder = ph||""; e.value = val||""; return e; }
function mkSel(val, opts) {
  var e = document.createElement("select"); e.className = "inp";
  for (var i = 0; i < opts.length; i++) {
    var o = document.createElement("option"); o.value = opts[i][0]; o.textContent = opts[i][1];
    if (opts[i][0] === val) o.selected = true;
    e.appendChild(o);
  }
  return e;
}
function mkLbl(txt, inp) {
  var w = document.createElement("div");
  var lb = mkEl("label","font-size:11px;color:#64748B;display:block;margin-bottom:3px;",txt);
  w.appendChild(lb); w.appendChild(inp); return w;
}
function ap(parent) {
  for (var i = 1; i < arguments.length; i++) {
    var child = arguments[i];
    if (!child) continue;
    if (child.nodeType) parent.appendChild(child);
    else parent.appendChild(document.createTextNode(String(child)));
  }
  return parent;
}

function showNotif(msg, isErr) {
  var nb = document.getElementById("notif-bar");
  if (!nb) {
    nb = document.createElement("div"); nb.id = "notif-bar";
    nb.style.cssText = "position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9998;border-radius:10px;font-weight:600;font-size:12px;max-width:440px;text-align:center;padding:10px 20px;display:none;";
    document.body.appendChild(nb);
  }
  nb.style.background = isErr ? "#7F1D1D" : "#064E3B";
  nb.style.border = "1px solid " + (isErr ? "#EF4444" : "#10B981");
  nb.style.color = "white"; nb.style.display = "block"; nb.textContent = msg;
  if (STATE.notifTimer) clearTimeout(STATE.notifTimer);

      b.style.cssText = "padding:5px 10px;border-radius:6px;border:none;font-weight:700;font-size:11px;cursor:"+(locked?"not-allowed":"pointer")+";font-family:inherit;background:"+(active?"#3B82F6":locked?"#111827":"#1E293B")+";color:"+(active?"white":locked?"#374151":"#94A3B8")+";opacity:"+(locked?".5":"1")+";";

// ── Coverage Tab ──────────────────────────────
function renderCov() {
  var emps = STATE.emps, lreqs = STATE.lreqs, y = STATE.year, m = STATE.month;

  var wrap = document.createElement("div");

  // Nav

  },"border:1px solid #334155;color:#F1F5F9;border-radius:8px;padding:7px 13px;font-size:17px;");

    if (m===11){STATE.month=0;STATE.year=y+1;}else STATE.month=m+1;
    STATE.selDay=null;STATE.covData=computeCov(STATE.emps,STATE.lreqs,STATE.year,STATE.month);render();
  },"border:1px solid #334155;color:#F1F5F9;border-radius:8px;padding:7px 13px;font-size:17px;");

  function mkStatBox(ic, v, lb, cl) {
    var b = document.createElement("div");
    b.style.cssText = "background:#1E293B;border:1px solid "+cl+"33;border-radius:8px;padding:4px 10px;display:flex;align-items:center;gap:5px;";

  ap(nav, prevBtn, titleSpan, nextBtn,

  wrap.appendChild(nav);

  // Calendar
  var dayHdr = document.createElement("div");
  dayHdr.style.cssText = "display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px;";

  var cal = document.createElement("div");

  for (var ei = 0; ei < fd; ei++) cal.appendChild(document.createElement("div"));
  for (var dy = 1; dy <= dim; dy++) {
    (function(day) {
      var ds2 = mkDs(y, m, day), dw = dowN(y, m, day);
      var isT = today.getDate()===day && today.getMonth()===m && today.getFullYear()===y;
      var isS = STATE.selDay === day;
      var cv = cov[ds2], crit = 0, ot = 0;
      if (cv) for (var ii3 = 0; ii3 < cv.issues.length; ii3++) {

      dc.style.cssText = "background:"+(isS?"#1D4ED8":isT?"#172554":"#111827")+";border:2px solid "+(isS?"#3B82F6":bc)+";border-radius:8px;padding:4px 3px;cursor:pointer;min-height:50px;";
      ap(dc, mkEl("div","font-size:11px;font-weight:800;color:"+(isT?"#F59E0B":(dw===5||dw===6)?"#FCA5A5":"#E2E8F0")+";margin-bottom:2px;",String(day)));

      if (ok) { var okb = mkEl("div","font-size:8px;background:#10B98122;color:#10B981;border-radius:3px;padding:1px 3px;font-weight:700;","✅"); bd.appendChild(okb); }

      dc.appendChild(bd);

  }
  wrap.appendChild(cal);

  // Day detail
  if (STATE.selDay) {
    var ds3 = mkDs(y, m, STATE.selDay), selCov = cov[ds3];

    var hasCrit2 = selCov.issues.some(function(i){return i.type==="critical";});
    var hasOT2 = selCov.issues.some(function(i){return i.type==="cover";});
    if (hasCrit2) dhb.appendChild(mkBadge("⚠️ Short","#7F1D1D","#FCA5A5"));
    if (hasOT2) dhb.appendChild(mkBadge("⏰ OT",OT.bg,OT.tx));
    dh.appendChild(dhb);
    detail.appendChild(dh);

    // Issues
    if (selCov.issues.length) {

// ── Transfer Date Picker ──────────────────────
function openTransferDatePicker(eid, emp, fromGrp, toGrp, newGi, maxOrd) {
  var old = document.getElementById("tr-ov"); if (old) old.remove();
  var o = mkEl("div","position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;direction:rtl;");
  o.id = "tr-ov";
  var box = mkEl("div","background:#1E293B;border-radius:14px;padding:20px;width:90%;max-width:420px;border:1px solid #334155;max-height:90vh;overflow-y:auto;");

  ap(box, mkEl("div","font-size:11px;color:#64748B;margin-bottom:3px;","Transfer employee:"));
  ap(box, mkEl("div","font-size:15px;font-weight:800;color:#F8FAFC;margin-bottom:2px;",emp.name));
  ap(box, mkEl("div","font-size:12px;color:#A78BFA;margin-bottom:14px;font-weight:600;","Group "+fromGrp+" → Group "+toGrp));

  var dateBox = mkEl("div","margin-bottom:12px;");
  var dateInp = mkInp("","","date");
  var t2 = new Date(); dateInp.value = mkDs(t2.getFullYear(),t2.getMonth(),t2.getDate());
  dateBox.appendChild(mkLbl("Transfer Start Date (new schedule begins from this date):", dateInp));
  box.appendChild(dateBox);

  var infoBox2 = mkEl("div","background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:#93C5FD;line-height:1.8;");
  infoBox2.textContent = "Select a date...";
  box.appendChild(infoBox2);

  var oldGi = emp.gi; // current gi = old group before transfer

  function recalc() {
    var sd = dateInp.value; if (!sd) return null;
    var y2=STATE.year, m2=STATE.month, dim2=daysInM(y2,m2);
    var lmap2 = buildLmap(STATE.lreqs);
    var workedOld = 0, workedNew = 0;
    var schedulePreview = [];
    for (var d4 = 1; d4 <= dim2; d4++) {
      var ds4 = mkDs(y2,m2,d4);
      var dv4 = doy(new Date(y2,m2,d4));
      var lt4 = lmapGet(lmap2,eid,ds4);
      var isOnLeave = lt4 && lt4 !== "overtime";
      if (ds4 < sd) {
        // Before transfer: use old group
        var sh4 = shiftFor(oldGi, dv4);
        if (sh4 !== "off" && !isOnLeave) workedOld++;
      } else {
        // From transfer date: use new group
        var sh4b = shiftFor(newGi, dv4);
        if (sh4b !== "off" && !isOnLeave) workedNew++;
      }
    }
    var total = workedOld + workedNew;
    var owed = Math.max(0, total - MAX_WORK);
    var col = total > MAX_WORK ? "#F87171" : total === MAX_WORK ? "#FCD34D" : "#34D399";

    var html2 = "<div style='margin-bottom:6px;font-weight:700;color:#60A5FA;'>📊 Working Days Calculation:</div>";
    html2 += "<div>Before "+fmtD(sd)+" (Group "+fromGrp+"): <b style='color:#E2E8F0'>"+workedOld+" days</b></div>";
    html2 += "<div>From "+fmtD(sd)+" (Group "+toGrp+"): <b style='color:#E2E8F0'>"+workedNew+" days</b></div>";
    html2 += "<div>Total projected: <b style='color:"+col+"'>"+total+" / "+MAX_WORK+"</b></div>";
    if (owed > 0) {
      html2 += "<div style='margin-top:7px;padding:6px 9px;background:#064E3B33;border-radius:6px;border:1px solid #10B98144;'>";
      html2 += "<b style='color:#34D399'>✅ "+owed+" compensatory OFF day"+(owed!==1?"s":"")+" will be granted</b><br>";
      html2 += "<span style='color:#6EE7B7;font-size:10px;'>These days will appear as C-OFF in the schedule automatically</span></div>";
    } else {
      html2 += "<div style='margin-top:6px;padding:5px 8px;background:#064E3B22;border-radius:6px;color:#6EE7B7;'>✅ No compensation needed</div>";
    }
    infoBox2.innerHTML = html2;
    return {sd:sd, owed:owed, workedOld:workedOld, workedNew:workedNew, total:total};
  }
  dateInp.onchange = recalc; recalc();

  var btnRow3 = mkRow("gap:8px;");
  ap(btnRow3,
    mkBtn("✅ Confirm Transfer","#7C3AED",function(){
      var calc = recalc(); if (!calc || !calc.sd) return;
      requireAdmin(function(){
        if(!STATE.transferLog) STATE.transferLog={};
        // Store oldGi so schedule before transfer date uses old rotation
        STATE.transferLog[eid]={
          name:emp.name, fromGroup:fromGrp, toGroup:toGrp,
          startDate:calc.sd,
          oldGi:oldGi,   // CRITICAL: old group index for pre-transfer days
          newGi:newGi,   // new group index for post-transfer days
          daysOwed:calc.owed,
          workedOld:calc.workedOld, workedNew:calc.workedNew
        };
        sLS("sc6_transferlog",STATE.transferLog);

        // Auto-create C-OFF compensation leaves if days owed > 0
        if (calc.owed > 0) {
          // Find calc.owed OFF days in the new group's schedule after transfer date
          // and mark them as C-OFF leaves
          var lmap2b = buildLmap(STATE.lreqs);
          var offCount = 0;
          var y2b = STATE.year, m2b = STATE.month, dim2b = daysInM(y2b,m2b);
          for (var dc = 1; dc <= dim2b && offCount < calc.owed; dc++) {
            var dsc = mkDs(y2b,m2b,dc);
            if (dsc < calc.sd) continue; // only after transfer
            var dvc = doy(new Date(y2b,m2b,dc));
            var shc = shiftFor(newGi, dvc);
            // Pick working days (not already off, not on leave) and grant C-OFF
            if (shc !== "off" && !lmapGet(lmap2b,eid,dsc)) {
              STATE.lreqs.push({
                id:"coff"+Date.now()+offCount,
                empId:eid, from:dsc, to:dsc,
                lt:"coff", reason:"Transfer compensation from Group "+fromGrp+" → "+toGrp,
                status:"approved", requestedAt:new Date().toISOString()
              });
              offCount++;
            }
          }
          sLS("sc6_lreqs",STATE.lreqs);
        }

        // Update employee to new group
        STATE.emps[eid].group = toGrp;
        STATE.emps[eid].gi = newGi;
        STATE.emps[eid].order = maxOrd;
        sLS("sc6_emps",STATE.emps);

        STATE.transferEmpId = null; STATE.transferMode = false;
        STATE.covData = computeCov(STATE.emps,STATE.lreqs,STATE.year,STATE.month);
        var msg = "✅ "+emp.name+" → Group "+toGrp+" from "+fmtD(calc.sd);
        if (calc.owed > 0) msg += " · "+calc.owed+" C-OFF days granted";
        showNotif(msg); o.remove(); render();
      });
    },"flex:1;border-radius:8px;padding:10px;font-size:13px;font-weight:700;"),
    mkBtn("Cancel","#374151",function(){o.remove();},"border-radius:8px;padding:10px 13px;font-size:12px;color:#94A3B8;")
  );
  box.appendChild(btnRow3);
  o.appendChild(box); document.body.appendChild(o);
  o.onclick = function(e){if(e.target===o)o.remove();};
}

// ── Export / Print ────────────────────────────
function doExport() {
  var y3=STATE.year, m3=STATE.month, emps=STATE.emps, dim3=daysInM(y3,m3);
  var cd3e=STATE.covData||computeCov(STATE.emps,STATE.lreqs,STATE.year,STATE.month);
  var lmap4=cd3e.lmap;
  var cov3e=cd3e.cov;
  // Build OT cover map for CSV
  var otMap3={};
  for(var ds_e in cov3e){
    var cd3ev=cov3e[ds_e];
    if(!cd3ev||!cd3ev.issues)continue;
    for(var ii3=0;ii3<cd3ev.issues.length;ii3++){
      var is3=cd3ev.issues[ii3];
      if(is3.type==="cover"&&is3.emp){
        if(!otMap3[is3.emp.id])otMap3[is3.emp.id]={};
        otMap3[is3.emp.id][ds_e]=is3.shift||"morning";
      }
    }
  }
  var rows=[], dArr=[], dshArr=[];
  for(var d6=1;d6<=dim3;d6++){dArr.push(d6);dshArr.push(DSH[dowN(y3,m3,d6)]);}
  rows.push(["Shift Schedule — "+MAR[m3]+" "+y3].concat(new Array(dim3+1).fill("")));
  rows.push(["Name","Role"].concat(dArr));
  rows.push(["",""].concat(dshArr));
  for(var gi5=0;gi5<GR.length;gi5++){
    var g3=GR[gi5], ge3=[];
    for(var k8 in emps)if(emps[k8].group===g3)ge3.push(emps[k8]);
    ge3.sort(function(a,b){return a.order-b.order;});
    rows.push(["Group "+g3].concat(new Array(dim3+1).fill("")));
    for(var ei5=0;ei5<ge3.length;ei5++){
      var emp9=ge3[ei5], r2=[emp9.name,getRTitle(getR(emp9.role).sh)];
      for(var d7=1;d7<=dim3;d7++){
        var ds6=mkDs(y3,m3,d7), lt3=lmapGet(lmap4,emp9.id,ds6);
        var dv5=doy(new Date(y3,m3,d7));
        var isOTc=otMap3[emp9.id]&&otMap3[emp9.id][ds6];
        var cell;
        if(lt3) cell=lt3==="overtime"?"OT":(LC[lt3]?LC[lt3].code:"AL");
        else if(isOTc){
          // Show shift code of covered shift (with asterisk to indicate OT)
          var otSh3=otMap3[emp9.id][ds6];
          cell=(SC[otSh3]||SC.morning).code+"*";  // e.g. "M*" = morning OT
        }
        else cell=(SC[getEmpEffectiveShift(emp9,ds6,dv5)]||SC.off).code;
        r2.push(cell);
      }
      rows.push(r2);
    }
  }
  var csv=rows.map(function(r){return r.map(function(c){return'"'+String(c||"").replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  var blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download="Schedule-"+MAR[m3]+"-"+y3+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showNotif("✅ Downloaded");
}

  hr2.appendChild(thTotal);
  thead.appendChild(hr2); tbl.appendChild(thead);

  var tbody = document.createElement("tbody");
  var allEmps = [];
  for (var k in emps) allEmps.push(emps[k]);
  allEmps.sort(function(a,b){return a.group<b.group?-1:a.group>b.group?1:a.order-b.order;});

  // Group separator rows
  var lastGrp = "";
  allEmps.forEach(function(emp, idx) {
    if (emp.group !== lastGrp) {
      lastGrp = emp.group;
      var gRow = document.createElement("tr");
      var gCell = document.createElement("td");
      gCell.colSpan = 15;
      gCell.style.cssText = "background:#1E293B;color:"+GRC[emp.group]+";font-weight:700;font-size:11px;padding:5px 9px;border:1px solid #0F172A;border-left:3px solid "+GRC[emp.group]+";";
      gCell.textContent = "Group "+emp.group;
      gRow.appendChild(gCell);
      tbody.appendChild(gRow);
    }

    var empPlan = plan[planYear] && plan[planYear][emp.id] ? plan[planYear][emp.id] : [];
    var rc = getR(emp.role);
    var tr2 = document.createElement("tr");
    tr2.style.background = idx % 2 === 0 ? "#1E293B" : "#111827";

    // Name cell
    var tdName = document.createElement("td");
    tdName.style.cssText = "padding:6px 8px;border:1px solid #0F172A;color:#E2E8F0;font-size:11px;";
    tdName.textContent = emp.name;
    tr2.appendChild(tdName);

    // Role cell
    var tdRole = document.createElement("td");
    tdRole.style.cssText = "padding:4px 4px;border:1px solid #0F172A;text-align:center;";
    tdRole.appendChild(mkChip(getRTitle(rc.sh), rc.cl+"33", rc.cl));
    tr2.appendChild(tdRole);

    var totalDays = 0;
    // Month cells
    for (var mi2 = 0; mi2 < 12; mi2++) {
      var tdM = document.createElement("td");
      tdM.style.cssText = "padding:3px;border:1px solid #0F172A;text-align:center;cursor:pointer;vertical-align:top;";
      // Find planned entries for this month
      var monthEntries = empPlan.filter(function(e){return e.month===mi2;});
      var mDays = monthEntries.reduce(function(s,e){return s+e.days;},0);
      totalDays += mDays;
      if (mDays > 0) {
        var mDiv = document.createElement("div");
        mDiv.style.cssText = "background:#1D4ED833;border-radius:4px;padding:2px 4px;color:#60A5FA;font-weight:700;font-size:10px;cursor:pointer;";
        mDiv.textContent = mDays + "d";
        mDiv.title = monthEntries.map(function(e){return fmtD(e.from)+"→"+fmtD(e.to)+(e.note?" ("+e.note+")":"");}).join(", ");
        mDiv.onclick = function(eid2, mi3) {
          return function() { openPlanMonth(eid2, planYear, mi3); };
        }(emp.id, mi2);
        tdM.appendChild(mDiv);
      } else {
        var addBtn = document.createElement("div");
        addBtn.style.cssText = "color:#1E3A5F;font-size:16px;line-height:1;cursor:pointer;";
        addBtn.textContent = "+";
        addBtn.onclick = function(eid2, mi3) {
          return function() { openPlanMonth(eid2, planYear, mi3); };
        }(emp.id, mi2);
        tdM.appendChild(addBtn);
      }
      tr2.appendChild(tdM);
    }

    // Total cell
    var tdT = document.createElement("td");
    var tColor = totalDays > 30 ? "#F87171" : totalDays > 0 ? "#34D399" : "#475569";
    tdT.style.cssText = "padding:5px 4px;border:1px solid #0F172A;text-align:center;font-weight:800;font-size:12px;color:"+tColor+";";
    tdT.textContent = totalDays > 0 ? totalDays+"d" : "—";
    tr2.appendChild(tdT);
    tbody.appendChild(tr2);
  });
  tbl.appendChild(tbody);

  var tWrap = document.createElement("div");
  tWrap.style.cssText = "overflow-x:auto;padding:10px;";
  tWrap.appendChild(tbl);
  summaryCard.appendChild(tWrap);
  wrap.appendChild(summaryCard);

  // ── Info note ──
  var noteDiv = mkEl("div","background:#172554;border:1px solid #3B82F644;border-radius:9px;padding:10px 13px;font-size:11px;color:#93C5FD;line-height:1.7;",
    "💡 Click + to add planned leave · Click days to edit/delete · Annual plan is for planning only — actual leave requests must still be submitted in 📋 Leaves tab"
  );
  wrap.appendChild(noteDiv);

  return wrap;
}

// ── Month Plan Modal ──────────────────────────────────────
function openPlanMonth(empId, planYear, monthIdx) {
  var old = document.getElementById("plan-ov"); if (old) old.remove();
  var emp = STATE.emps[empId]; if (!emp) return;
  var MAR_SH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MAR_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  var o = mkEl("div","position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;direction:rtl;");
  o.id = "plan-ov";
  var box = mkEl("div","background:#1E293B;border-radius:14px;padding:20px;width:90%;max-width:420px;border:1px solid #334155;max-height:88vh;overflow-y:auto;");

  ap(box,
    mkEl("div","font-size:11px;color:#64748B;margin-bottom:2px;","Leave plan for:"),
    mkEl("div","font-size:14px;font-weight:800;color:#F8FAFC;margin-bottom:2px;",emp.name),
    mkEl("div","font-size:12px;color:#A78BFA;font-weight:600;margin-bottom:14px;",MAR_FULL[monthIdx]+" "+planYear)
  );

  // Existing entries for this month
  if (!STATE.annualPlan) STATE.annualPlan = {};
  if (!STATE.annualPlan[planYear]) STATE.annualPlan[planYear] = {};
  if (!STATE.annualPlan[planYear][empId]) STATE.annualPlan[planYear][empId] = [];
  var entries = STATE.annualPlan[planYear][empId].filter(function(e){return e.month===monthIdx;});

  var existDiv = document.createElement("div");
  existDiv.style.marginBottom = "13px";

  function refreshExisting() {
    existDiv.innerHTML = "";
    var ents = STATE.annualPlan[planYear][empId].filter(function(e){return e.month===monthIdx;});
    if (ents.length === 0) {
      existDiv.appendChild(mkEl("div","font-size:11px;color:#475569;padding:7px 0;","No planned leaves for this month yet"));
      return;
    }
    existDiv.appendChild(mkEl("div","font-size:11px;font-weight:700;color:#94A3B8;margin-bottom:6px;","Planned entries:"));
    ents.forEach(function(entry) {
      var row2 = mkRow("background:#111827;border-radius:7px;padding:7px 10px;margin-bottom:5px;gap:8px;");
      var info = document.createElement("div"); info.style.flex = "1";
      ap(info,
        mkEl("div","font-size:11px;color:#E2E8F0;font-weight:600;",fmtD(entry.from)+" → "+fmtD(entry.to)+" ("+entry.days+" days)"),
        entry.note ? mkEl("div","font-size:10px;color:#64748B;font-style:italic;",'"'+entry.note+'"') : mkEl("div","","")
      );
      var stBg = entry.status==="approved"?"#064E3B":entry.status==="rejected"?"#7F1D1D":"#1E293B";
      var stCl = entry.status==="approved"?"#34D399":entry.status==="rejected"?"#F87171":"#F59E0B";
      var stLb = entry.status==="approved"?"✅ Approved":entry.status==="rejected"?"❌ Rejected":"⏳ Pending";
      var stBadge = mkEl("span","font-size:9px;background:"+stBg+";color:"+stCl+";border-radius:4px;padding:2px 6px;white-space:nowrap;align-self:center;",stLb);
      var delBtn = document.createElement("button");
      delBtn.style.cssText = "background:#7F1D1D22;border:1px solid #EF4444;color:#F87171;border-radius:5px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:inherit;";
      delBtn.textContent = "🗑️";
      delBtn.onclick = function(eid2) {
        return function() {
          requireAdmin(function(){
            STATE.annualPlan[planYear][eid2] = STATE.annualPlan[planYear][eid2].filter(function(e){return e!==entry;});
            sLS("sc6_annualplan", STATE.annualPlan);
            showNotif("Deleted"); refreshExisting(); render();
          });
        };
      }(empId);
      // Approve/reject (admin only)
      if (can("canApproveLeave") && STATE.isAdmin && entry.status==="pending") {
        var apBtn = document.createElement("button");
        apBtn.style.cssText = "background:#064E3B;border:1px solid #10B981;color:#34D399;border-radius:5px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:inherit;";
        apBtn.textContent = "✅";
        apBtn.onclick = function(e2){return function(){requireAdmin(function(){e2.status="approved";sLS("sc6_annualplan",STATE.annualPlan);refreshExisting();render();});};}(entry);
        row2.appendChild(info); row2.appendChild(stBadge); row2.appendChild(apBtn); row2.appendChild(delBtn);
      } else {
        row2.appendChild(info); row2.appendChild(stBadge); row2.appendChild(delBtn);
      }
      existDiv.appendChild(row2);
    });
  }
  refreshExisting();
  box.appendChild(existDiv);

  // Add new entry form
  var addHdr = mkEl("div","font-size:11px;font-weight:700;color:#94A3B8;margin-bottom:8px;","+ Add planned leave:");
  box.appendChild(addHdr);
  var formDiv = mkEl("div","background:#111827;border-radius:9px;padding:12px;margin-bottom:12px;");
  var fInp = mkInp("","","date"); var tInp2 = mkInp("","","date");
  var noteInp = mkInp("","Optional note — e.g. Hajj, vacation...");

  // Set default dates within this month
  var firstDay = mkDs(planYear, monthIdx, 1);
  var lastDay = mkDs(planYear, monthIdx, daysInM(planYear, monthIdx));
  fInp.value = firstDay; fInp.min = firstDay; fInp.max = lastDay;
  tInp2.value = firstDay; tInp2.min = firstDay; tInp2.max = lastDay;

  var daysPreview = mkEl("div","font-size:11px;color:#60A5FA;margin-top:5px;font-weight:700;","");
  function updPreview(){
    if(fInp.value&&tInp2.value&&tInp2.value>=fInp.value){
      var d2=rangeD(fInp.value,tInp2.value).length;
      // Count only working days
      var workD=0;
      for(var pd=0;pd<rangeD(fInp.value,tInp2.value).length;pd++){
        var pds=rangeD(fInp.value,tInp2.value)[pd];
        var pdv=doy(new Date(pds));
        if(getEmpEffectiveShift(emp,pds,pdv)!=="off")workD++;
      }
      daysPreview.textContent="📅 "+d2+" calendar days · "+workD+" working days";
    } else daysPreview.textContent="";
  }
  fInp.onchange=updPreview; tInp2.onchange=updPreview; updPreview();

  var fg2 = mkEl("div","display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;");
  fg2.appendChild(mkLbl("From", fInp)); fg2.appendChild(mkLbl("To", tInp2));
  formDiv.appendChild(fg2);
  formDiv.appendChild(mkLbl("Note", noteInp));
  formDiv.appendChild(daysPreview);
  box.appendChild(formDiv);

  var btnRow4 = mkRow("gap:8px;");
  var addEntryBtn = mkBtn("➕ Add to Plan","#3B82F6",function(){
    if(!fInp.value||!tInp2.value){showNotif("Select dates",true);return;}
    if(tInp2.value<fInp.value){showNotif("End must be after start",true);return;}
    var dts3=rangeD(fInp.value,tInp2.value);
    var workDays3=0;
    for(var wd3=0;wd3<dts3.length;wd3++){var ds3=dts3[wd3];if(getEmpEffectiveShift(emp,ds3,doy(new Date(ds3)))!=="off")workDays3++;}
    var newEntry={id:"pl"+Date.now(),month:monthIdx,from:fInp.value,to:tInp2.value,
      days:workDays3,calDays:dts3.length,note:noteInp.value.trim(),
      status:"pending",addedAt:new Date().toISOString()};
    STATE.annualPlan[planYear][empId].push(newEntry);
    sLS("sc6_annualplan",STATE.annualPlan);
    showNotif("✅ Added — "+workDays3+" working days");
    noteInp.value=""; fInp.value=firstDay; tInp2.value=firstDay; updPreview();
    refreshExisting(); render();
  },"border-radius:7px;padding:9px;font-size:12px;flex:1;");
  var closeBtn2 = mkBtn("Close","#374151",function(){o.remove();},"border-radius:7px;padding:9px 13px;font-size:12px;color:#94A3B8;");
  ap(btnRow4, addEntryBtn, closeBtn2);
  box.appendChild(btnRow4);

  o.appendChild(box); document.body.appendChild(o);
  o.onclick = function(e){if(e.target===o)o.remove();};
}

function init() {
  STATE.admins = lLS("sc6_admins", DEF_ADMINS);
  if (!STATE.admins.some(function(a){return a.role==="superadmin";})) { STATE.admins = DEF_ADMINS; sLS("sc6_admins", STATE.admins); }
  STATE.emps = lLS("sc6_emps", buildEmps());
  STATE.lreqs = lLS("sc6_lreqs", []);
  STATE.rules = lLS("sc6_rules", DEF_RULES);
  STATE.otAssign = lLS("sc6_otassign", {});
  STATE.roleTitles = lLS("sc6_roletitles", {});
  STATE.shiftOverride = lLS("sc6_shiftoverride", {});
  STATE.transferLog = lLS("sc6_transferlog", {});
  STATE.annualPlan = lLS("sc6_annualplan", {});
  STATE.isAdmin = false;
  STATE.currentUser = null;
  STATE.covData = computeCov(STATE.emps, STATE.lreqs, STATE.year, STATE.month);
  render();
}
init();
</script>
</body>
